<title>Asistencia Oh Diosa</title>

<style>
:root{color-scheme:light}
body{margin:0}
[hidden]{display:none!important}

/* Layout: cabecera de marca rosada + reloj grande, pestañas tipo píldora, tarjetas amplias para tocar desde el celular de la tienda */
:root{
  --bg:#FFF5F8; --surface:#FFFFFF; --surface-2:#FDEBF0;
  --brand:#F7C4D2; --brand-strong:#EB98B0; --ink:#2B2427; --muted:#7A6870; --line:#F1DCE3;
  --btn-bg:#2B2427; --btn-fg:#FFFFFF;
  --ok:#22865A; --ok-bg:#E2F4EA; --warn:#B26F0E; --warn-bg:#FDF0DA; --bad:#C8384E; --bad-bg:#FCE4E8;
  --idle:#6F6168; --idle-bg:#F3EDEF;
  --shadow:0 10px 30px -14px rgba(120,40,70,.28);
  --f-display:"Fredoka","Nunito",ui-rounded,"Segoe UI",system-ui,sans-serif;
  --f-body:"Nunito",ui-rounded,"Segoe UI",system-ui,-apple-system,sans-serif;
  --r-lg:26px; --r-md:18px; --r-sm:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1B1417; --surface:#261D21; --surface-2:#30252A;
  --brand:#F2B9C9; --brand-strong:#F2B9C9; --ink:#F8EEF1; --muted:#B8A5AD; --line:#3A2D33;
  --btn-bg:#F7C4D2; --btn-fg:#2B2427;
  --ok:#62CF9B; --ok-bg:#1D3A2C; --warn:#F2B55E; --warn-bg:#3D2E16; --bad:#F5808F; --bad-bg:#45222A;
  --idle:#B8A5AD; --idle-bg:#30262A; --shadow:0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#1B1417; --surface:#261D21; --surface-2:#30252A;
  --brand:#F2B9C9; --brand-strong:#F2B9C9; --ink:#F8EEF1; --muted:#B8A5AD; --line:#3A2D33;
  --btn-bg:#F7C4D2; --btn-fg:#2B2427;
  --ok:#62CF9B; --ok-bg:#1D3A2C; --warn:#F2B55E; --warn-bg:#3D2E16; --bad:#F5808F; --bad-bg:#45222A;
  --idle:#B8A5AD; --idle-bg:#30262A; --shadow:0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;padding-inline:16px;padding-block:18px 60px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance;line-height:1.15}
h2{font-size:1.6rem} h3{font-size:1.2rem}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand-strong);outline-offset:3px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

/* Cabecera */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:18px 26px}
.logo{background:var(--brand);border-radius:var(--r-lg);padding:14px 20px;display:grid;place-items:center;box-shadow:var(--shadow);position:relative}

.brand-txt{display:flex;flex-direction:column;gap:2px;flex:1;min-width:200px}
.brand-txt h1{font-size:clamp(1.8rem,4vw,2.5rem)}
.brand-txt p{margin:0;color:var(--muted);font-weight:600}
.clock{text-align:right;display:flex;flex-direction:column;gap:0}
.clock b{font-family:var(--f-display);font-weight:600;font-size:clamp(2.2rem,5vw,3.2rem);line-height:1;font-variant-numeric:tabular-nums}
.clock b small{font-size:.45em;margin-left:6px;color:var(--muted)}
.clock span{color:var(--muted);font-weight:700;text-transform:capitalize}
.spark{position:absolute;width:14px;height:14px;fill:var(--ink)}

.tabs{display:flex;gap:8px;background:var(--surface);padding:7px;border-radius:999px;box-shadow:var(--shadow);overflow-x:auto;scrollbar-width:none}
.tabs button{flex:1;border:0;background:transparent;padding:14px 22px;border-radius:999px;font-weight:800;font-size:1.05rem;white-space:nowrap;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:9px}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-selected="true"]{background:var(--btn-bg);color:var(--btn-fg)}
.demo{background:var(--warn-bg);color:var(--warn);border-radius:var(--r-md);padding:12px 18px;font-weight:700;font-size:.95rem}

/* Bloques */
.panel{background:var(--surface);border-radius:var(--r-lg);padding:26px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:20px;min-width:0}
.panel-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px}
.step{display:flex;align-items:center;gap:12px}
.step em{font-style:normal;font-family:var(--f-display);font-weight:600;background:var(--brand);color:#2B2427;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none}

.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{border:2px solid var(--line);background:var(--surface);padding:12px 20px;border-radius:999px;font-weight:800;font-size:1rem}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#2B2427}
.chip.sm{padding:8px 15px;font-size:.92rem}

.grid-people{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.person{border:2px solid var(--line);background:var(--surface);border-radius:var(--r-lg);padding:20px;text-align:left;display:flex;flex-direction:column;gap:14px;transition:transform .15s ease,border-color .15s ease}
.person:hover{transform:translateY(-3px);border-color:var(--brand-strong)}
.person .who{display:flex;align-items:center;gap:14px;min-width:0}
.avatar{width:58px;height:58px;border-radius:50%;background:var(--brand);color:#2B2427;font-family:var(--f-display);font-weight:600;font-size:1.35rem;display:grid;place-items:center;flex:none}
.avatar.lg{width:84px;height:84px;font-size:2rem}
.person strong{font-size:1.15rem;display:block;line-height:1.2}
.person .shift{color:var(--muted);font-weight:600;font-size:.93rem}
.pill{display:inline-flex;align-items:center;gap:7px;font-weight:800;font-size:.86rem;padding:6px 12px;border-radius:999px;align-self:flex-start;white-space:nowrap}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.pill.en{background:var(--ok-bg);color:var(--ok)} .pill.falta,.pill.ausente{background:var(--bad-bg);color:var(--bad)}
.pill.tarde{background:var(--warn-bg);color:var(--warn)} .pill.pronto,.pill.salio{background:var(--idle-bg);color:var(--idle)}
.pill.plain::before{display:none}
.pill.almuerzo{background:var(--brand);color:#2B2427}
.types{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.type{border:2px solid var(--line);background:var(--surface);border-radius:var(--r-md);padding:14px 12px;display:flex;align-items:center;gap:10px;font-weight:800;font-size:1rem;text-align:left;min-height:64px}
.type svg{width:26px;height:26px;flex:none}
.type[aria-pressed="true"]{border-color:var(--ink);background:var(--surface-2)}
.type[aria-pressed="true"].ENTRADA,.type[aria-pressed="true"].REGRESO{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.type[aria-pressed="true"].ALMUERZO,.type[aria-pressed="true"].SALIDA{border-color:var(--brand-strong);background:var(--brand);color:#2B2427}
.type:disabled{opacity:.35;cursor:not-allowed}
.empty{padding:34px 20px;text-align:center;color:var(--muted);border:2px dashed var(--line);border-radius:var(--r-lg);font-weight:600}

/* En tienda */
.stores{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:18px}
.store{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.store header{background:var(--surface-2);padding:18px 22px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.store header b{font-family:var(--f-display);font-weight:600;font-size:2rem;line-height:1}
.store ul{list-style:none;margin:0;padding:10px 12px 14px;display:flex;flex-direction:column}
.store li{display:flex;align-items:center;gap:12px;padding:12px 10px;border-bottom:1px solid var(--line)}
.store li:last-child{border-bottom:0}
.store li .avatar{width:44px;height:44px;font-size:1.05rem}
.store li div{flex:1;min-width:0}
.store li small{display:block;color:var(--muted);font-weight:600}

/* Admin */
.subtabs{display:flex;flex-wrap:wrap;gap:8px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.kpi{background:var(--surface-2);border-radius:var(--r-md);padding:18px 20px;display:flex;flex-direction:column;gap:2px}
.kpi span{color:var(--muted);font-weight:700;font-size:.9rem;text-transform:uppercase;letter-spacing:.06em}
.kpi b{font-family:var(--f-display);font-weight:600;font-size:2.1rem;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi.bad b{color:var(--bad)} .kpi.warn b{color:var(--warn)}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-md)}
table{width:100%;border-collapse:collapse;min-width:640px}
th,td{padding:14px 16px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:.8rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);background:var(--surface-2);font-weight:800}
tbody tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface-2)}
.cell-person{display:flex;align-items:center;gap:12px}
.cell-person .avatar{width:38px;height:38px;font-size:.95rem}
.cell-person small{display:block;color:var(--muted);font-weight:600;font-size:.85rem}

.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-weight:800;font-size:.9rem}
.field input,.field select{border:2px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:12px 14px;min-height:50px;width:100%}
.field input:focus,.field select:focus{border-color:var(--brand-strong);outline:none}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.switch{display:flex;align-items:center;gap:10px;font-weight:700}
.switch input{width:24px;height:24px;accent-color:var(--brand-strong)}

.btn{border:0;background:var(--btn-bg);color:var(--btn-fg);padding:14px 24px;border-radius:999px;font-weight:800;min-height:52px;display:inline-flex;align-items:center;justify-content:center;gap:9px}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.danger{background:var(--bad-bg);color:var(--bad)}
.btn.sm{padding:9px 16px;min-height:40px;font-size:.92rem}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:20px;height:20px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.row.end{justify-content:flex-end}

.team{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.member{border:2px solid var(--line);border-radius:var(--r-md);padding:18px;display:flex;flex-direction:column;gap:12px}
.member.off{opacity:.55}

/* Modal y teclado */
.overlay{position:fixed;inset:0;background:rgba(43,36,39,.45);backdrop-filter:blur(4px);display:grid;place-items:center;padding:16px;z-index:20;overflow-y:auto}

.keypad button:active{transform:scale(.94);background:var(--brand)}
.keypad button.fn{font-family:var(--f-body);font-size:1rem;font-weight:800;color:var(--muted)}

.success{text-align:center;align-items:center}
.check{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;background:var(--ok-bg);color:var(--ok)}
.check.SALIDA,.check.ALMUERZO{background:var(--brand);color:#2B2427}

.check path{stroke-dasharray:60;stroke-dashoffset:60;animation:draw .5s .15s ease forwards}

.success h2{font-size:2.2rem}
.success .big{font-family:var(--f-display);font-size:1.5rem;font-weight:600;margin:0}

.note.warn{background:var(--warn-bg);color:var(--warn)} .note.ok{background:var(--ok-bg);color:var(--ok)}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--btn-bg);color:var(--btn-fg);padding:14px 22px;border-radius:999px;font-weight:800;z-index:40;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.marks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.marks li{display:flex;align-items:center;gap:12px;background:var(--surface-2);border-radius:var(--r-sm);padding:10px 14px;flex-wrap:wrap}
.marks li b{font-variant-numeric:tabular-nums;min-width:90px}
.marks li .grow{flex:1;min-width:120px;color:var(--muted);font-weight:600;font-size:.9rem}
.loading{color:var(--muted);font-weight:700;padding:30px;text-align:center}

@media (max-width:640px){

  .clock{text-align:left;width:100%}

  .tabs button{padding:12px 14px;font-size:.98rem}
  .tabs button span{display:none}
  .tabs button[aria-selected="true"] span{display:inline}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.check path{stroke-dashoffset:0}}

<script>
/* ============ CONFIGURACIÓN ============ */
// Pega aquí la URL /exec de tu Apps Script. Si queda vacía, la app funciona en modo demostración.
const API_URL = 'https://script.google.com/macros/s/AKfycbyVbwSPfndllE8FWKkKyShRZAUdz8qVppFdf6jY7QaHG29qCOU6jxwUbgHPn9QXo6e7/exec';

/* ============ Utilidades ============ */
const TZ = 'America/Lima';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};
const fmtParts = new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
function lima(d = new Date()) {
  const p = {}; fmtParts.formatToParts(d).forEach(x => p[x.type] = x.value);
  if (p.hour === '24') p.hour = '00';
  return { fecha: `${p.year}-${p.month}-${p.day}`, hora: `${p.hour}:${p.minute}:${p.second}`, ts: d.getTime() };
}
const toMin = t => { const [h, m] = String(t).split(':').map(Number); return h * 60 + (m || 0); };
const nowMin = () => toMin(lima().hora);
function h12(t) {
  if (!t) return '—';
  const [h, m] = t.split(':').map(Number);
  return `${h % 12 || 12}:${String(m).padStart(2, '0')} ${h < 12 ? 'a. m.' : 'p. m.'}`;
}
function dur(min) { min = Math.round(min); return `${Math.floor(min / 60)} h ${String(min % 60).padStart(2, '0')} min`; }
function durC(min) { min = Math.round(min); return `${Math.floor(min / 60)}:${String(min % 60).padStart(2, '0')}`; }
const fDate = (f, opt) => new Intl.DateTimeFormat('es-PE', { timeZone: TZ, ...opt }).format(new Date(f + 'T12:00:00-05:00'));
const fechaLarga = f => fDate(f, { weekday: 'long', day: 'numeric', month: 'long' });
const fechaCorta = f => fDate(f, { weekday: 'short', day: '2-digit', month: 'short' });
function addDays(f, n) { const d = new Date(f + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
const iniciales = n => String(n).trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase();
const tsDe = (fecha, hora) => new Date(`${fecha}T${hora.length === 5 ? hora + ':00' : hora}-05:00`).getTime();
function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t);
  setTimeout(() => t.remove(), 3200);
}

const NOMBRES = { ENTRADA: 'Entrada', ALMUERZO: 'Salida a almuerzo', REGRESO: 'Regreso de almuerzo', SALIDA: 'Salida' };
const CORTO = { ENTRADA: 'Entrada', ALMUERZO: 'Almuerzo', REGRESO: 'Regreso', SALIDA: 'Salida' };
const SIGUIENTES = { NINGUNA: ['ENTRADA'], ENTRADA: ['ALMUERZO', 'SALIDA'], ALMUERZO: ['REGRESO'], REGRESO: ['SALIDA'], SALIDA: ['ENTRADA'] };
const ICONOS = {
  ENTRADA: '<path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4"/><path d="M3 12h11"/><path d="m10 8 4 4-4 4"/>',
  ALMUERZO: '<path d="M7 3v8a2 2 0 0 0 2 2v8"/><path d="M11 3v6a2 2 0 0 1-4 0"/><path d="M17 21V3c-2 1-3 4-3 8h3"/>',
  REGRESO: '<path d="M4 12a8 8 0 1 0 2.5-5.8"/><path d="M4 4v4h4"/><path d="M12 8v4l3 2"/>',
  SALIDA: '<path d="M10 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4"/><path d="M9 12h12"/><path d="m17 8 4 4-4 4"/>',
};
const icono = t => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${ICONOS[t]}</svg>`;
const pub = c => ({ tolerancia: c.tolerancia, tiendas: c.tiendas, almuerzo: c.almuerzo ?? 60 });

/* ============ Modo demostración (sin Apps Script) ============ */
const DEMO_KEY = 'ohd-asistencia-demo-v2';
function crearDemo() {
  let seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  const vendedoras = [
    ['V1', 'Ana Quispe', 'Tienda Ancash', 'Mañana', '09:00', '15:00'],
    ['V2', 'Lucía Rojas', 'Tienda Ancash', 'Tarde', '15:00', '21:00'],
    ['V3', 'Milagros Huamán', 'Tienda Mantaro', 'Mañana', '09:00', '15:00'],
    ['V4', 'Karina Poma', 'Tienda Mantaro', 'Tarde', '15:00', '21:00'],
    ['V5', 'Fiorella Ccanto', 'Tienda Cajamarca', 'Mañana', '09:00', '15:00'],
    ['V6', 'Yesenia Ríos', 'Tienda Cajamarca', 'Tarde', '15:00', '21:00'],
    ['V7', 'Rosa Inga', 'Tienda Mantaro', 'Mañana', '10:00', '16:00'],
  ].map(([id, nombre, tienda, turno, entrada, salida], i) => ({ id, nombre, tienda, turno, entrada, salida, dni: '7000000' + (i + 1), activa: true }));
  const marcas = []; const hoy = lima().fecha; const ahora = nowMin();
  const hm = m => `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}:${String(Math.floor(rnd() * 60)).padStart(2, '0')}`;
  const push = (v, fecha, min, tipo, minTarde = 0) => {
    const hora = hm(min);
    marcas.push({ id: 'M' + marcas.length + 'd', fecha, hora, ts: tsDe(fecha, hora), vendedoraId: v.id, nombre: v.nombre, tienda: v.tienda, tipo, minTarde, origen: 'vendedora', nota: '' });
  };
  for (let d = 24; d >= 0; d--) {
    const fecha = addDays(hoy, -d);
    vendedoras.forEach((v, i) => {
      if (d > 0 && rnd() < .12) return;
      const e = toMin(v.entrada) + Math.round(rnd() * 16 - 6);
      const s = toMin(v.salida) + Math.round(rnd() * 12 - 2);
      if (d === 0) {
        if (v.id === 'V7' || e > ahora) return;
        push(v, fecha, e, 'ENTRADA', Math.max(0, e - toMin(v.entrada)) > 5 ? e - toMin(v.entrada) : 0);
        if (s < ahora) push(v, fecha, s, 'SALIDA');
        return;
      }
      push(v, fecha, e, 'ENTRADA', Math.max(0, e - toMin(v.entrada)) > 5 ? e - toMin(v.entrada) : 0);
      if (!(d === 3 && i === 2)) push(v, fecha, s, 'SALIDA');
    });
  }
  return { config: { adminPin: '1234', tolerancia: 5, almuerzo: 60, tiendas: ['Tienda Ancash', 'Tienda Mantaro', 'Tienda Cajamarca'] }, vendedoras, marcas };
}
const demoDB = () => { let d = store.get(DEMO_KEY, null); if (!d) { d = crearDemo(); store.set(DEMO_KEY, d); } return d; };
const demoSave = d => store.set(DEMO_KEY, d);
const pinN = x => String(x ?? '').replace(/\D/g, '').padStart(4, '0');
const tardanza = (ent, hora, tol) => { const d = toMin(hora) - toMin(ent); return d > tol ? d : 0; };
const dniN = x => String(x ?? '').replace(/\D/g, '').padStart(8, '0');
const sinPin = v => { const { dni, ...r } = v; return r; };
function demoAdmin(p) { if (pinN(p.adminPin) !== pinN(demoDB().config.adminPin)) throw new Error('PIN de administrador incorrecto'); }
const Demo = {
  init() { const d = demoDB(), h = lima().fecha; return { config: pub(d.config), vendedoras: d.vendedoras.filter(v => v.activa).map(sinPin), hoy: h, marcasHoy: d.marcas.filter(m => m.fecha === h) }; },
  hoy() { const d = demoDB(), h = lima().fecha; return { hoy: h, marcasHoy: d.marcas.filter(m => m.fecha === h) }; },
  marcar(p) {
    const d = demoDB(); const v = d.vendedoras.find(x => x.id === p.id);
    if (!v || !v.activa) throw new Error('No encontramos a esta vendedora');
    if (dniN(v.dni) !== dniN(p.dni)) throw new Error('DNI incorrecto. Revisa los 8 números.');
    const now = lima(); const hoy = d.marcas.filter(m => m.fecha === now.fecha && m.vendedoraId === v.id).sort((a, b) => a.ts - b.ts);
    const ult = hoy[hoy.length - 1];
    if (ult && now.ts - ult.ts < 120000) throw new Error('Ya marcaste tu ' + ult.tipo.toLowerCase() + ' hace un momento');
    const permitidos = SIGUIENTES[ult ? ult.tipo : 'NINGUNA'];
    const tipo = p.tipo || permitidos[0];
    if (!permitidos.includes(tipo)) throw new Error('Ahora te toca marcar: ' + permitidos.map(t => NOMBRES[t]).join(' o '));
    const minTarde = tipo === 'ENTRADA' && !hoy.some(m => m.tipo === 'ENTRADA') ? tardanza(v.entrada, now.hora, d.config.tolerancia) : 0;
    const m = { id: 'M' + now.ts, fecha: now.fecha, hora: now.hora, ts: now.ts, vendedoraId: v.id, nombre: v.nombre, tienda: v.tienda, tipo, minTarde, origen: 'vendedora', nota: '' };
    d.marcas.push(m); demoSave(d); return { marca: m, marcasDia: hoy.concat([m]) };
  },
  login(p) { demoAdmin(p); return { ok: true }; },
  reporte(p) { demoAdmin(p); const d = demoDB(); return { marcas: d.marcas.filter(m => m.fecha >= p.desde && m.fecha <= p.hasta), vendedoras: d.vendedoras, config: pub(d.config) }; },
  guardarVendedora(p) {
    demoAdmin(p); const d = demoDB(); const v = p.v;
    if (!String(v.nombre || '').trim()) throw new Error('Escribe el nombre');
    if (!/^\d{8}$/.test(v.dni)) throw new Error('El DNI debe tener 8 números');
    if (d.vendedoras.some(x => x.id !== v.id && dniN(x.dni) === dniN(v.dni))) throw new Error('Ese DNI ya está registrado en otra vendedora');
    const i = d.vendedoras.findIndex(x => x.id === v.id);
    if (i >= 0) d.vendedoras[i] = { ...v }; else d.vendedoras.push({ ...v, id: 'V' + Date.now() });
    demoSave(d); return { ok: true };
  },
  marcaManual(p) {
    demoAdmin(p); const d = demoDB(); const v = d.vendedoras.find(x => x.id === p.vendedoraId);
    if (!v) throw new Error('Elige una vendedora');
    const ts = tsDe(p.fecha, p.hora);
    const primera = p.tipo === 'ENTRADA' && !d.marcas.some(m => m.vendedoraId === v.id && m.fecha === p.fecha && m.tipo === 'ENTRADA' && m.ts < ts);
    const m = { id: 'M' + Date.now(), fecha: p.fecha, hora: p.hora + ':00', ts, vendedoraId: v.id, nombre: v.nombre, tienda: v.tienda, tipo: p.tipo, minTarde: primera ? tardanza(v.entrada, p.hora, d.config.tolerancia) : 0, origen: 'admin', nota: p.nota || '' };
    d.marcas.push(m); demoSave(d); return m;
  },
  eliminarMarca(p) { demoAdmin(p); const d = demoDB(); d.marcas = d.marcas.filter(m => m.id !== p.id); demoSave(d); return { ok: true }; },
  guardarConfig(p) {
    demoAdmin(p); const d = demoDB();
    if (p.almuerzo !== undefined) d.config.almuerzo = Math.max(0, Number(p.almuerzo) || 0);
    if (p.tolerancia !== undefined) d.config.tolerancia = Math.max(0, Number(p.tolerancia) || 0);
    if (p.tiendas) d.config.tiendas = p.tiendas.map(s => s.trim()).filter(Boolean);
    if (p.nuevoPin) { if (!/^\d{4}$/.test(p.nuevoPin)) throw new Error('El PIN debe tener 4 números'); d.config.adminPin = p.nuevoPin; }
    demoSave(d); return pub(d.config);
  },
};

/* ============ API ============ */
async function api(action, payload = {}) {
  if (!API_URL) { await new Promise(r => setTimeout(r, 180)); return Demo[action]({ ...payload }); }
  let r;
  try {
    r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action, ...payload }) });
  } catch (e) { throw new Error('Sin conexión. Revisa el internet e inténtalo otra vez.'); }
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || 'Algo salió mal');
  return j.data;
}
const adminApi = (action, payload = {}) => api(action, { ...payload, adminPin: S.adminPin });

/* ============ Estado ============ */
const S = {
  view: 'marcar', config: { tolerancia: 5, tiendas: [] }, vendedoras: [], marcasHoy: [], hoy: lima().fecha,
  tienda: store.get('ohd-tienda', null), adminPin: null, adminTab: 'resumen', periodo: 'q',
  desde: null, hasta: null, rep: null, fV: '', fT: '',
};

function marcasDe(id, lista = S.marcasHoy) { return lista.filter(m => m.vendedoraId === id).sort((a, b) => a.ts - b.ts); }
function estado(v) {
  const ms = marcasDe(v.id); const ult = ms[ms.length - 1]; const n = nowMin();
  const primeraE = ms.find(m => m.tipo === 'ENTRADA');
  const next = SIGUIENTES[ult ? ult.tipo : 'NINGUNA'];
  if (ult && (ult.tipo === 'ENTRADA' || ult.tipo === 'REGRESO')) {
    const t = primeraE && primeraE.minTarde > 0;
    return { k: t ? 'tarde' : 'en', label: `En tienda desde ${h12((primeraE || ult).hora.slice(0, 5))}`, next };
  }
  if (ult && ult.tipo === 'ALMUERZO') return { k: 'almuerzo', label: `En almuerzo desde ${h12(ult.hora.slice(0, 5))}`, next };
  if (ult) return { k: 'salio', label: `Salió ${h12(ult.hora.slice(0, 5))}`, next };
  if (n >= toMin(v.salida)) return { k: 'ausente', label: 'Sin marcas hoy', next };
  if (n > toMin(v.entrada) + S.config.tolerancia) return { k: 'falta', label: `No ha marcado · entra ${h12(v.entrada)}`, next };
  return { k: 'pronto', label: `Entra a las ${h12(v.entrada)}`, next };
}

/* Agrupa marcas por vendedora y día y calcula horas trabajadas */
function dias(marcas) {
  const g = {};
  marcas.forEach(m => { (g[m.vendedoraId + '|' + m.fecha] ||= []).push(m); });
  return Object.values(g).map(ms => {
    ms.sort((a, b) => a.ts - b.ts);
    let abierta = null, minutos = 0, entrada = null, salida = null, almIni = null, almFin = null, minAlmuerzo = 0, almAbierto = null;
    ms.forEach(m => {
      if (m.tipo === 'ENTRADA' || m.tipo === 'REGRESO') {
        if (!abierta) abierta = m;
        if (m.tipo === 'ENTRADA' && !entrada) entrada = m;
        if (m.tipo === 'REGRESO') { almFin = m; if (almAbierto) { minAlmuerzo += (m.ts - almAbierto.ts) / 60000; almAbierto = null; } }
      } else {
        if (abierta) { minutos += (m.ts - abierta.ts) / 60000; abierta = null; }
        if (m.tipo === 'SALIDA') salida = m;
        else { if (!almIni) almIni = m; almAbierto = m; }
      }
    });
    const minTarde = entrada ? entrada.minTarde : 0;
    const ultima = ms[ms.length - 1];
    const limite = S.config.almuerzo ?? 60;
    return { fecha: ms[0].fecha, vid: ms[0].vendedoraId, nombre: ms[0].nombre, tienda: ms[0].tienda, entrada, salida, almIni, almFin, minAlmuerzo,
      almuerzoLargo: limite > 0 && minAlmuerzo > limite, minutos, minTarde, sinSalida: ultima.tipo !== 'SALIDA', sinRegreso: ultima.tipo === 'ALMUERZO', marcas: ms };
  });
}

/* ============ Reloj ============ */
function tick() {
  const n = lima(); const [h, m] = n.hora.split(':').map(Number);
  $('#clk').innerHTML = `${h % 12 || 12}:${String(m).padStart(2, '0')}<small>${h < 12 ? 'a. m.' : 'p. m.'}</small>`;

    <div class="step"><em>2</em><h2>Toca tu nombre</h2></div>

          <div><strong>${esc(v.nombre)}</strong><span class="shift">${esc(v.turno)} · ${h12(v.entrada)} – ${h12(v.salida)}</span></div></div>

function keypadHTML(largo = 4) {
  return `<div class="dots${largo > 4 ? ' many' : ''}" id="dots">${'<span></span>'.repeat(largo)}</div><p class="err" id="perr"></p>
  <div class="keypad">${[1,2,3,4,5,6,7,8,9].map(n => `<button data-k="${n}">${n}</button>`).join('')}
  <button class="fn" data-k="c">Borrar todo</button><button data-k="0">0</button><button class="fn" data-k="b">⌫ Borrar</button></div>`;
}
function bindKeypad(onPin, largo = 4) {
  let pin = ''; let busy = false;
  const dots = () => $$('#dots span').forEach((s, i) => s.classList.toggle('on', i < pin.length));
  const press = async k => {
    if (busy) return;
    if (k === 'b') pin = pin.slice(0, -1); else if (k === 'c') pin = ''; else if (pin.length < largo) pin += k;
    $('#perr').textContent = ''; dots();
    if (pin.length === largo) {
      busy = true;
      try { await onPin(pin); }
      catch (e) {
        $('#perr').textContent = e.message; const d = $('#dots'); d.classList.remove('shake'); void d.offsetWidth; d.classList.add('shake');
        pin = ''; dots();
      }
      busy = false;
    }
  };
  $$('.keypad button').forEach(b => b.onclick = () => press(b.dataset.k));
  const onKey = e => { if (!$('#dots')) return document.removeEventListener('keydown', onKey); if (/^\d$/.test(e.key)) press(e.key); else if (e.key === 'Backspace') press('b'); else if (e.key === 'Escape') cerrar(); };
  document.addEventListener('keydown', onKey);
}
function modal(html, cls = '') {
  clearTimeout(cerrar.t);
  $('#modal').innerHTML = `<div class="overlay" id="ov"><div class="sheet ${cls}" role="dialog" aria-modal="true">${html}</div></div>`;
  $('#ov').onclick = e => { if (e.target.id === 'ov') cerrar(); };
  $$('[data-close]').forEach(b => b.onclick = cerrar);
}
function cerrar() { $('#modal').innerHTML = ''; clearTimeout(cerrar.t); }

function abrirMarcado(v) {
  const e = estado(v);
  modal(`
    <div class="sheet-head"><div class="avatar lg">${esc(iniciales(v.nombre))}</div>
      <div><h2>${esc(v.nombre.split(' ')[0])}</h2><span class="muted">Digita tu DNI (8 números)</span></div>
      <button class="x" data-close aria-label="Cerrar">×</button></div>
    <div class="types" role="group" aria-label="Qué vas a marcar">${['ENTRADA', 'ALMUERZO', 'REGRESO', 'SALIDA'].map(t => `
      <button class="type ${t}" data-tipo="${t}" aria-pressed="${t === e.next[0]}" ${e.next.includes(t) ? '' : 'disabled'}>${icono(t)}<span>${NOMBRES[t]}</span></button>`).join('')}</div>
    ${keypadHTML(8)}`);
  let tipo = e.next[0];
  $$('.type').forEach(b => b.onclick = () => { tipo = b.dataset.tipo; $$('.type').forEach(x => x.setAttribute('aria-pressed', x === b)); });
  bindKeypad(async dni => {
    const r = await api('marcar', { id: v.id, dni, tipo });
    S.marcasHoy = S.marcasHoy.filter(m => m.vendedoraId !== v.id).concat(r.marcasDia);
    exito(v, r);
    render();
    api('hoy').then(d => { S.marcasHoy = d.marcasHoy; if (S.view !== 'admin') render(); }).catch(() => {});
  }, 8);
}

function exito(v, r) {
  const m = r.marca; const nombre = esc(v.nombre.split(' ')[0]);
  const d = dias(r.marcasDia)[0];
  let extra = '';
  if (m.tipo === 'ENTRADA') {
    extra = m.minTarde > 0
      ? `<p class="note warn">Llegaste ${m.minTarde} min después de tu horario (${h12(v.entrada)}).</p>`
      : `<p class="note ok">¡Puntual! Que tengas un lindo turno.</p>`;
  } else if (m.tipo === 'ALMUERZO') {
    extra = `<p class="note ok">Al volver, marca tu regreso de almuerzo.</p>`;
  } else if (m.tipo === 'REGRESO') {
    const lim = S.config.almuerzo ?? 60;
    extra = d && lim > 0 && d.minAlmuerzo > lim
      ? `<p class="note warn">Tu almuerzo duró ${Math.round(d.minAlmuerzo)} min (el tiempo permitido es ${lim} min).</p>`
      : `<p class="note ok">Tu almuerzo duró ${Math.round(d ? d.minAlmuerzo : 0)} min.</p>`;
  } else {
    extra = `<p class="note ok">Hoy trabajaste ${dur(d ? d.minutos : 0)}.</p>`;
  }
  const saludo = { ENTRADA: `¡Hola, ${nombre}!`, ALMUERZO: `¡Buen provecho, ${nombre}!`, REGRESO: `¡De vuelta, ${nombre}!`, SALIDA: `¡Hasta pronto, ${nombre}!` }[m.tipo];
  modal(`
    <div class="success" style="display:flex;flex-direction:column;gap:16px;align-items:center">
      <div class="check ${m.tipo}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
      <h2>${saludo}</h2>
      <p class="big">${NOMBRES[m.tipo]} registrada · ${h12(m.hora.slice(0, 5))}</p>
      ${extra}
      <button class="btn" data-close style="min-width:180px">Listo</button>
    </div>`);
  cerrar.t = setTimeout(cerrar, 6000);
}

/* ============ Vista: Administrar ============ */
function rango(p) {
  const h = lima().fecha; const [y, m, d] = h.split('-').map(Number);
  const ym = (yy, mm) => `${yy}-${String(mm).padStart(2, '0')}`;
  const fin = (yy, mm) => new Date(Date.UTC(yy, mm, 0)).getUTCDate();
  const [py, pm] = m === 1 ? [y - 1, 12] : [y, m - 1];
  switch (p) {
    case 'q': return d <= 15 ? [`${ym(y, m)}-01`, `${ym(y, m)}-15`] : [`${ym(y, m)}-16`, `${ym(y, m)}-${fin(y, m)}`];
    case 'qa': return d <= 15 ? [`${ym(py, pm)}-16`, `${ym(py, pm)}-${fin(py, pm)}`] : [`${ym(y, m)}-01`, `${ym(y, m)}-15`];
    case 'm': return [`${ym(y, m)}-01`, `${ym(y, m)}-${fin(y, m)}`];
    case 'ma': return [`${ym(py, pm)}-01`, `${ym(py, pm)}-${fin(py, pm)}`];
    default: return [S.desde || h, S.hasta || h];
  }
}

function renderAdmin() {
  if (!S.adminPin) {
    $('#view').innerHTML = `<section class="panel" style="max-width:520px;margin:0 auto;width:100%">
      <div class="sheet-head"><div class="avatar lg">
        <svg viewBox="0 0 24 24" width="38" height="38" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="3"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></div>
        <div><h2>Administración</h2><span class="muted">Ingresa el PIN de administrador</span></div></div>
      ${keypadHTML()}</section>`;
    bindKeypad(async pin => { await api('login', { adminPin: pin }); S.adminPin = pin; await cargarReporte(); });
    return;
  }
  const tabs = [['resumen', 'Resumen y pago'], ['detalle', 'Detalle por día'], ['equipo', 'Equipo'], ['ajustes', 'Ajustes']];
  const [desde, hasta] = rango(S.periodo);
  $('#view').innerHTML = `
  <section class="panel">
    <div class="panel-head">
      <div class="subtabs">${tabs.map(([k, l]) => `<button class="chip" data-at="${k}" aria-pressed="${S.adminTab === k}">${l}</button>`).join('')}</div>
      <button class="btn ghost sm" id="salirAdmin">Cerrar sesión</button>
    </div>
    ${S.adminTab === 'resumen' || S.adminTab === 'detalle' ? `
    <div class="toolbar">
      <div class="chips">${[['q', 'Esta quincena'], ['qa', 'Quincena anterior'], ['m', 'Este mes'], ['ma', 'Mes anterior'], ['c', 'Otras fechas']].map(([k, l]) => `<button class="chip sm" data-per="${k}" aria-pressed="${S.periodo === k}">${l}</button>`).join('')}</div>
    </div>
    ${S.periodo === 'c' ? `<div class="toolbar"><div class="field"><label for="fdesde">Desde</label><input type="date" id="fdesde" value="${desde}"></div>
      <div class="field"><label for="fhasta">Hasta</label><input type="date" id="fhasta" value="${hasta}"></div>
      <button class="btn" id="aplicar">Ver</button></div>` : ''}
    <p class="muted" style="margin:0;font-weight:700">Del ${fechaLarga(desde)} al ${fechaLarga(hasta)}</p>` : ''}
    <div id="adminBody">${S.rep ? '' : '<div class="loading">Cargando…</div>'}</div>
  </section>`;
  $$('[data-at]').forEach(b => b.onclick = () => { S.adminTab = b.dataset.at; renderAdmin(); });
  $$('[data-per]').forEach(b => b.onclick = () => { S.periodo = b.dataset.per; if (b.dataset.per !== 'c') cargarReporte(); else renderAdmin(); });
  $('#salirAdmin').onclick = () => { S.adminPin = null; S.rep = null; renderAdmin(); };
  if ($('#aplicar')) $('#aplicar').onclick = () => { S.desde = $('#fdesde').value; S.hasta = $('#fhasta').value; if (S.desde > S.hasta) [S.desde, S.hasta] = [S.hasta, S.desde]; cargarReporte(); };
  if (!S.rep) return;
  ({ resumen: adminResumen, detalle: adminDetalle, equipo: adminEquipo, ajustes: adminAjustes })[S.adminTab]();
}

async function cargarReporte() {
  const [desde, hasta] = rango(S.periodo);
  S.rep = null; renderAdmin();
  try { S.rep = await adminApi('reporte', { desde, hasta }); S.rep.desde = desde; S.rep.hasta = hasta; S.config = S.rep.config; }
  catch (e) { toast(e.message); if (/administrador/.test(e.message)) S.adminPin = null; }
  renderAdmin();
}

function resumenFilas() {
  const ds = dias(S.rep.marcas);
  return S.rep.vendedoras.map(v => {
    const mis = ds.filter(d => d.vid === v.id);
    return {
      v, dias: mis.length, minutos: mis.reduce((a, d) => a + d.minutos, 0),
      tardanzas: mis.filter(d => d.minTarde > 0).length, minTarde: mis.reduce((a, d) => a + d.minTarde, 0),
      sinSalida: mis.filter(d => d.sinSalida).length,
    };
  }).filter(r => r.v.activa || r.dias).sort((a, b) => a.v.tienda.localeCompare(b.v.tienda) || a.v.nombre.localeCompare(b.v.nombre));
}

function adminResumen() {
  const filas = resumenFilas();
  const tot = filas.reduce((a, r) => ({ min: a.min + r.minutos, t: a.t + r.tardanzas, s: a.s + r.sinSalida, mt: a.mt + r.minTarde }), { min: 0, t: 0, s: 0, mt: 0 });
  $('#adminBody').innerHTML = `
  <div style="display:flex;flex-direction:column;gap:18px">
    <div class="kpis">
      <div class="kpi"><span>Horas del equipo</span><b>${durC(tot.min)}</b></div>
      <div class="kpi ${tot.t ? 'warn' : ''}"><span>Tardanzas</span><b>${tot.t}</b><small class="muted">${tot.mt} min en total</small></div>
      <div class="kpi ${tot.s ? 'bad' : ''}"><span>Días sin salida</span><b>${tot.s}</b><small class="muted">Corrígelos en Detalle</small></div>
    </div>
    <div class="row end"><button class="btn" id="xls"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>Exportar a Excel</button></div>
    <div class="table-wrap"><table>
      <thead><tr><th>Vendedora</th><th class="r">Días</th><th class="r">Horas trabajadas</th><th class="r">Tardanzas</th><th class="r">Min. tarde</th><th class="r">Sin salida</th></tr></thead>
      <tbody>${filas.map(r => `<tr class="click" data-v="${esc(r.v.id)}">
        <td><div class="cell-person"><div class="avatar">${esc(iniciales(r.v.nombre))}</div><div><strong>${esc(r.v.nombre)}</strong><small>${esc(r.v.tienda)} · ${esc(r.v.turno)}</small></div></div></td>
        <td class="r num">${r.dias}</td><td class="r num"><strong>${durC(r.minutos)}</strong> h</td>
        <td class="r">${r.tardanzas ? `<span class="pill tarde plain">${r.tardanzas}</span>` : '<span class="muted">0</span>'}</td>
        <td class="r num">${r.minTarde}</td>
        <td class="r">${r.sinSalida ? `<span class="pill falta plain">${r.sinSalida}</span>` : '<span class="muted">0</span>'}</td></tr>`).join('')}</tbody>
    </table></div>
    <p class="muted" style="margin:0;font-size:.9rem">Las horas cuentan solo los tramos con entrada y salida. Un día sin salida no suma horas hasta que lo corrijas.</p>
  </div>`;
  $$('tr[data-v]').forEach(tr => tr.onclick = () => { S.fV = tr.dataset.v; S.adminTab = 'detalle'; renderAdmin(); });
  $('#xls').onclick = exportar;
}

function adminDetalle() {
  let ds = dias(S.rep.marcas).sort((a, b) => b.fecha.localeCompare(a.fecha) || a.tienda.localeCompare(b.tienda));
  if (S.fV) ds = ds.filter(d => d.vid === S.fV);
  if (S.fT) ds = ds.filter(d => d.tienda === S.fT);

  <div style="display:flex;flex-direction:column;gap:16px">
    <div class="toolbar">
      <div class="field" style="flex:1;min-width:180px"><label for="fV">Vendedora</label><select id="fV"><option value="">Todas</option>${S.rep.vendedoras.map(v => `<option value="${esc(v.id)}" ${v.id === S.fV ? 'selected' : ''}>${esc(v.nombre)}</option>`).join('')}</select></div>
      <div class="field" style="flex:1;min-width:180px"><label for="fT">Tienda</label><select id="fT"><option value="">Todas</option>${S.config.tiendas.map(t => `<option ${t === S.fT ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select></div>
      <button class="btn" id="addMark">+ Agregar marca</button>
    </div>
    ${ds.length ? `<div class="table-wrap"><table>
      <thead><tr><th>Fecha</th><th>Vendedora</th><th>Entrada</th><th>Almuerzo</th><th>Salida</th><th class="r">Horas</th><th>Estado</th></tr></thead>
      <tbody>${ds.map((d, i) => `<tr class="click" data-i="${i}">
        <td class="num" style="text-transform:capitalize;white-space:nowrap">${fechaCorta(d.fecha)}</td>
        <td><strong>${esc(d.nombre)}</strong><br><small class="muted">${esc(d.tienda)}</small></td>
        <td class="num">${d.entrada ? h12(d.entrada.hora.slice(0, 5)) : '—'}</td>
        <td class="num" style="white-space:nowrap">${d.almIni ? `${h12(d.almIni.hora.slice(0, 5))} – ${d.almFin ? h12(d.almFin.hora.slice(0, 5)) : '…'}<br><small class="muted">${Math.round(d.minAlmuerzo)} min</small>` : '—'}</td>
        <td class="num">${d.salida ? h12(d.salida.hora.slice(0, 5)) : '—'}</td>
        <td class="r num">${durC(d.minutos)}</td>
        <td><div class="row" style="gap:6px">${d.sinRegreso ? '<span class="pill falta">Sin regreso</span>' : d.sinSalida ? '<span class="pill falta">Sin salida</span>' : ''}${d.minTarde > 0 ? `<span class="pill tarde">Tarde ${d.minTarde} min</span>` : ''}${d.almuerzoLargo ? '<span class="pill tarde">Almuerzo largo</span>' : ''}${!d.sinSalida && !d.minTarde && !d.almuerzoLargo ? '<span class="pill en">Puntual</span>' : ''}</div></td></tr>`).join('')}</tbody>
    </table></div>` : '<div class="empty">No hay marcas en este período con estos filtros.</div>'}
    <p class="muted" style="margin:0;font-size:.9rem">Toca un día para ver cada marca, corregir una salida olvidada o eliminar un error.</p>
  </div>`;
  $('#fV').onchange = e => { S.fV = e.target.value; adminDetalle(); };
  $('#fT').onchange = e => { S.fT = e.target.value; adminDetalle(); };
  $('#addMark').onclick = () => formMarca({ vid: S.fV, fecha: lima().fecha });
  $$('tr[data-i]').forEach(tr => tr.onclick = () => verDia(ds[+tr.dataset.i]));
}

function verDia(d) {
  modal(`
    <div class="sheet-head"><div><h2>${esc(d.nombre)}</h2><span class="muted" style="text-transform:capitalize">${fechaLarga(d.fecha)} · ${esc(d.tienda)}</span></div><button class="x" data-close aria-label="Cerrar">×</button></div>
    <ul class="marks">${d.marcas.map(m => `<li>
      <span class="pill ${{ ENTRADA: 'en', REGRESO: 'en', ALMUERZO: 'almuerzo', SALIDA: 'salio' }[m.tipo]} plain">${CORTO[m.tipo] || m.tipo}</span>
      <b>${h12(m.hora.slice(0, 5))}</b>
      <span class="grow">${m.origen === 'admin' ? 'Agregada por admin' : 'Marcada por ella'}${m.minTarde ? ` · ${m.minTarde} min tarde` : ''}${m.nota ? ' · ' + esc(m.nota) : ''}</span>
      <button class="btn danger sm" data-del="${esc(m.id)}">Eliminar</button></li>`).join('')}</ul>
    <p class="muted" style="margin:0">Horas trabajadas: <strong>${dur(d.minutos)}</strong>${d.minAlmuerzo ? ` · Almuerzo: <strong>${Math.round(d.minAlmuerzo)} min</strong>` : ''}${d.sinRegreso ? ' · falta registrar el regreso' : d.sinSalida ? ' · falta registrar la salida' : ''}</p>
    <div class="row end"><button class="btn" id="addHere">+ Agregar marca</button></div>`);
  $$('[data-del]').forEach(b => b.onclick = async () => {
    if (b.dataset.sure !== '1') { b.dataset.sure = '1'; b.textContent = '¿Seguro? Toca otra vez'; return; }
    b.disabled = true;
    try { await adminApi('eliminarMarca', { id: b.dataset.del }); cerrar(); toast('Marca eliminada'); await cargarReporte(); refrescarHoy(); }
    catch (e) { toast(e.message); b.disabled = false; }
  });
  $('#addHere').onclick = () => formMarca({ vid: d.vid, fecha: d.fecha, tipo: d.sinRegreso ? 'REGRESO' : d.sinSalida ? 'SALIDA' : 'ENTRADA' });
}

function formMarca({ vid = '', fecha, tipo = 'ENTRADA' }) {
  modal(`
    <div class="sheet-head"><div><h2>Agregar marca</h2><span class="muted">Para olvidos o correcciones. Quedará registrada como hecha por administración.</span></div><button class="x" data-close aria-label="Cerrar">×</button></div>
    <form id="fm" class="form">
      <div class="field" style="grid-column:1/-1"><label for="mv">Vendedora</label><select id="mv" required><option value="">Elige…</option>${S.rep.vendedoras.map(v => `<option value="${esc(v.id)}" ${v.id === vid ? 'selected' : ''}>${esc(v.nombre)} · ${esc(v.tienda)}</option>`).join('')}</select></div>
      <div class="field"><label for="mt">Tipo</label><select id="mt">${Object.keys(NOMBRES).map(t => `<option value="${t}" ${t === tipo ? 'selected' : ''}>${NOMBRES[t]}</option>`).join('')}</select></div>
      <div class="field"><label for="mf">Fecha</label><input type="date" id="mf" value="${fecha}" required></div>
      <div class="field"><label for="mh">Hora</label><input type="time" id="mh" required></div>
      <div class="field" style="grid-column:1/-1"><label for="mn">Nota (opcional)</label><input id="mn" placeholder="Ej.: olvidó marcar la salida"></div>
      <div class="row end" style="grid-column:1/-1"><button type="button" class="btn ghost" data-close>Cancelar</button><button class="btn" id="mok">Guardar marca</button></div>
    </form>`);
  $$('[data-close]').forEach(b => b.onclick = cerrar);
  $('#fm').onsubmit = async e => {
    e.preventDefault(); $('#mok').disabled = true;
    try {
      await adminApi('marcaManual', { vendedoraId: $('#mv').value, tipo: $('#mt').value, fecha: $('#mf').value, hora: $('#mh').value, nota: $('#mn').value });
      cerrar(); toast('Marca guardada'); await cargarReporte(); refrescarHoy();
    } catch (er) { toast(er.message); $('#mok').disabled = false; }
  };
}

function adminEquipo() {
  const vs = [...S.rep.vendedoras].sort((a, b) => (b.activa - a.activa) || a.tienda.localeCompare(b.tienda) || a.nombre.localeCompare(b.nombre));
  $('#adminBody').innerHTML = `
  <div style="display:flex;flex-direction:column;gap:16px">
    <div class="row" style="justify-content:space-between"><span class="muted" style="font-weight:700">${vs.filter(v => v.activa).length} vendedoras activas</span><button class="btn" id="nueva">+ Agregar vendedora</button></div>
    <div class="team">${vs.map(v => `<div class="member ${v.activa ? '' : 'off'}">
      <div class="cell-person"><div class="avatar">${esc(iniciales(v.nombre))}</div><div><strong>${esc(v.nombre)}</strong><small>${esc(v.tienda)} · DNI ${esc(v.dni || '—')}</small></div></div>
      <div class="row" style="gap:8px"><span class="pill pronto plain">${esc(v.turno)} · ${h12(v.entrada)} – ${h12(v.salida)}</span>${v.activa ? '' : '<span class="pill falta plain">Inactiva</span>'}</div>
      <button class="btn ghost sm" data-ed="${esc(v.id)}">Editar</button></div>`).join('')}</div>
  </div>`;
  $('#nueva').onclick = () => formVendedora({ activa: true, turno: 'Mañana', entrada: '09:00', salida: '15:00', tienda: S.config.tiendas[0] });
  $$('[data-ed]').forEach(b => b.onclick = () => formVendedora(S.rep.vendedoras.find(v => v.id === b.dataset.ed)));
}

function formVendedora(v) {
  const turnos = { 'Mañana': ['09:00', '15:00'], 'Tarde': ['15:00', '21:00'] };
  modal(`
    <div class="sheet-head"><div><h2>${v.id ? 'Editar vendedora' : 'Nueva vendedora'}</h2><span class="muted">Su tienda y turno se usan para calcular tardanzas.</span></div><button class="x" data-close aria-label="Cerrar">×</button></div>
    <form id="fvend" class="form">
      <div class="field" style="grid-column:1/-1"><label for="vn">Nombre y apellido</label><input id="vn" value="${esc(v.nombre || '')}" required></div>
      <div class="field"><label for="vt">Tienda</label><select id="vt">${S.config.tiendas.map(t => `<option ${t === v.tienda ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select></div>
      <div class="field"><label for="vtu">Turno</label><select id="vtu">${['Mañana', 'Tarde', 'Otro'].map(t => `<option ${t === v.turno ? 'selected' : ''}>${t}</option>`).join('')}</select></div>
      <div class="field"><label for="ve">Hora de entrada</label><input type="time" id="ve" value="${v.entrada || ''}" required></div>
      <div class="field"><label for="vs">Hora de salida</label><input type="time" id="vs" value="${v.salida || ''}" required></div>
      <div class="field"><label for="vp">DNI (8 números)</label><input id="vp" inputmode="numeric" maxlength="8" pattern="\\d{8}" value="${esc(v.dni || '')}" required><small class="muted">Con este número marcará su asistencia.</small></div>
      <div class="field" style="justify-content:flex-end"><label class="switch" for="va"><input type="checkbox" id="va" ${v.activa ? 'checked' : ''}> Activa</label></div>
      <div class="row end" style="grid-column:1/-1"><button type="button" class="btn ghost" data-close>Cancelar</button><button class="btn" id="vok">Guardar</button></div>
    </form>`);
  $$('[data-close]').forEach(b => b.onclick = cerrar);
  $('#vtu').onchange = e => { const t = turnos[e.target.value]; if (t) { $('#ve').value = t[0]; $('#vs').value = t[1]; } };
  $('#fvend').onsubmit = async e => {
    e.preventDefault(); $('#vok').disabled = true;
    const nv = { id: v.id, nombre: $('#vn').value.trim(), tienda: $('#vt').value, turno: $('#vtu').value, entrada: $('#ve').value, salida: $('#vs').value, dni: $('#vp').value.trim(), activa: $('#va').checked };
    try { await adminApi('guardarVendedora', { v: nv }); cerrar(); toast('Vendedora guardada'); await cargarReporte(); await recargarBase(); }
    catch (er) { toast(er.message); $('#vok').disabled = false; }
  };
}

function adminAjustes() {
  $('#adminBody').innerHTML = `
  <form id="fcfg" class="form" style="max-width:760px">
    <div class="field"><label for="ctol">Tolerancia de llegada (minutos)</label><input type="number" min="0" max="60" id="ctol" value="${S.config.tolerancia}"><small class="muted">Llegar dentro de este margen no cuenta como tardanza.</small></div>
    <div class="field"><label for="calm">Minutos de almuerzo permitidos</label><input type="number" min="0" max="180" id="calm" value="${S.config.almuerzo ?? 60}"><small class="muted">Si se pasa, aparece como "Almuerzo largo". Pon 0 para no controlarlo.</small></div>
    <div class="field"><label for="cpin">Nuevo PIN de administrador</label><input id="cpin" inputmode="numeric" maxlength="4" pattern="\\d{4}" placeholder="Déjalo vacío para no cambiarlo"></div>
    <div class="field" style="grid-column:1/-1"><label for="ctie">Tiendas (una por línea)</label>
      <textarea id="ctie" rows="4" style="border:2px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:12px 14px;font:inherit;color:inherit;resize:vertical">${esc(S.config.tiendas.join('\n'))}</textarea></div>
    <div class="row" style="grid-column:1/-1;justify-content:space-between">
      <span class="muted" style="font-weight:700">${API_URL ? 'Conectado a la Google Sheet' : 'Modo demostración (sin Google Sheet)'}</span>
      <div class="row">${API_URL ? '' : '<button type="button" class="btn ghost" id="resetDemo">Reiniciar datos de ejemplo</button>'}<button class="btn" id="cok">Guardar ajustes</button></div>
    </div>
  </form>`;
  $('#fcfg').onsubmit = async e => {
    e.preventDefault(); $('#cok').disabled = true;
    const nuevoPin = $('#cpin').value.trim();
    try {
      S.config = await adminApi('guardarConfig', { tolerancia: $('#ctol').value, almuerzo: $('#calm').value, tiendas: $('#ctie').value.split('\n'), nuevoPin: nuevoPin || undefined });
      if (nuevoPin) S.adminPin = nuevoPin;
      toast('Ajustes guardados'); await recargarBase(); renderAdmin();
    } catch (er) { toast(er.message); $('#cok').disabled = false; }
  };
  if ($('#resetDemo')) $('#resetDemo').onclick = async () => { store.set(DEMO_KEY, crearDemo()); S.adminPin = '1234'; await recargarBase(); await cargarReporte(); toast('Datos de ejemplo reiniciados'); };
}

/* ============ Exportar a Excel ============ */
function cargarXLSX() {
  return new Promise((res, rej) => {
    if (window.XLSX) return res(window.XLSX);
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = () => res(window.XLSX); s.onerror = () => rej(new Error('No se pudo cargar el exportador. Revisa tu conexión.'));
    document.head.appendChild(s);
  });
}
async function exportar() {
  const btn = $('#xls'); btn.disabled = true;
  try {
    const X = await cargarXLSX();
    const resumen = resumenFilas().map(r => ({
      'Vendedora': r.v.nombre, 'DNI': r.v.dni || '', 'Tienda': r.v.tienda, 'Turno': r.v.turno, 'Horario': `${r.v.entrada}-${r.v.salida}`,
      'Días trabajados': r.dias, 'Horas (h:mm)': durC(r.minutos), 'Horas decimales': Math.round(r.minutos / 60 * 100) / 100,
      'Tardanzas': r.tardanzas, 'Minutos tarde': r.minTarde, 'Días sin salida': r.sinSalida,
    }));
    const detalle = dias(S.rep.marcas).sort((a, b) => a.fecha.localeCompare(b.fecha) || a.nombre.localeCompare(b.nombre)).map(d => ({
      'Fecha': d.fecha, 'Vendedora': d.nombre, 'Tienda': d.tienda,
      'Entrada': d.entrada ? d.entrada.hora.slice(0, 5) : '',
      'Salida a almuerzo': d.almIni ? d.almIni.hora.slice(0, 5) : '', 'Regreso de almuerzo': d.almFin ? d.almFin.hora.slice(0, 5) : '',
      'Min. almuerzo': Math.round(d.minAlmuerzo), 'Salida': d.salida ? d.salida.hora.slice(0, 5) : '',
      'Horas (h:mm)': durC(d.minutos), 'Horas decimales': Math.round(d.minutos / 60 * 100) / 100,
      'Minutos tarde': d.minTarde, 'Observación': [d.sinRegreso ? 'Sin regreso' : d.sinSalida ? 'Sin salida' : '', d.almuerzoLargo ? 'Almuerzo largo' : ''].filter(Boolean).join(', '),
    }));
    const wb = X.utils.book_new();
    const s1 = X.utils.json_to_sheet(resumen); s1['!cols'] = [24, 11, 18, 10, 13, 15, 13, 15, 10, 13, 14].map(w => ({ wch: w }));
    const s2 = X.utils.json_to_sheet(detalle); s2['!cols'] = [12, 24, 18, 9, 16, 18, 13, 9, 13, 15, 13, 22].map(w => ({ wch: w }));
    X.utils.book_append_sheet(wb, s1, 'Resumen');
    X.utils.book_append_sheet(wb, s2, 'Detalle');
    X.writeFile(wb, `Asistencia_OhDiosa_${S.rep.desde}_al_${S.rep.hasta}.xlsx`);
    toast('Excel descargado');
  } catch (e) { toast(e.message); }
  btn.disabled = false;
}

/* ============ Arranque ============ */
function render() {
  $$('.tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.view === S.view));
  ({ marcar: renderMarcar, ahora: renderAhora, admin: renderAdmin })[S.view]();
}
async function recargarBase() {
  const d = await api('init');
  Object.assign(S, { config: d.config, vendedoras: d.vendedoras, marcasHoy: d.marcasHoy, hoy: d.hoy });
}
async function refrescarHoy() {
  try { const d = await api('hoy'); S.marcasHoy = d.marcasHoy; if (d.hoy !== S.hoy) await recargarBase(); } catch (e) {}
}
$$('.tabs button').forEach(b => b.onclick = () => { S.view = b.dataset.view; render(); if (S.view === 'admin' && S.adminPin && !S.rep) cargarReporte(); });
(async () => {
  $('#demo').hidden = !!API_URL;
  tick(); setInterval(tick, 1000);
  try { await recargarBase(); render(); }
  catch (e) { $('#view').innerHTML = `<div class="empty">No pudimos conectar con la hoja de asistencia. ${esc(e.message)}</div>`; }
  setInterval(async () => { if ($('#modal').innerHTML) return; await refrescarHoy(); if (S.view !== 'admin') render(); }, 60000);
})();
</script>
