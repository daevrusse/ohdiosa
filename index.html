<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Escáner de Inventario</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --accent: #22c55e;
    --accent-dark: #16a34a;
    --text: #e2e8f0;
    --text-dim: #94a3b8;
    --border: #334155;
    --danger: #ef4444;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 12px;
    max-width: 720px;
    margin: 0 auto;
  }
  h1 {
    font-size: 1.3rem;
    text-align: center;
    margin: 8px 0 16px;
  }
  .card {
    background: var(--card);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 14px;
    border: 1px solid var(--border);
  }
  #reader {
    width: 100%;
    border-radius: 10px;
    overflow: hidden;
  }
  .controls {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }
  button {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-primary { background: var(--accent); color: #06210f; }
  .btn-primary:active { background: var(--accent-dark); }
  .btn-secondary { background: #334155; color: var(--text); }
  .btn-danger { background: var(--danger); color: #fff; }
  .status {
    text-align: center;
    font-size: 0.85rem;
    color: var(--text-dim);
    margin-top: 8px;
    min-height: 18px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.85rem;
  }
  th, td {
    padding: 8px 6px;
    border-bottom: 1px solid var(--border);
    text-align: left;
  }
  th { color: var(--text-dim); font-weight: 600; font-size: 0.75rem; text-transform: uppercase; }
  input[type="text"], input[type="number"], select {
    width: 100%;
    background: #0f172a;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px;
    border-radius: 6px;
    font-size: 0.85rem;
  }
  label {
    display: block;
    font-size: 0.72rem;
    color: var(--text-dim);
    margin-bottom: 4px;
    text-transform: uppercase;
  }
  .origen-row { display: flex; gap: 10px; }
  .origen-row > div { flex: 1; }
  .del-btn {
    background: transparent;
    color: var(--danger);
    font-size: 1.1rem;
    padding: 4px;
    flex: none;
  }
  .empty-msg {
    text-align: center;
    color: var(--text-dim);
    padding: 20px 0;
    font-size: 0.9rem;
  }
  .export-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .export-row button { flex: 1 1 45%; }
  .btn-whatsapp { background: #25D366; color: #06210f; }
  .count-badge {
    background: var(--accent);
    color: #06210f;
    border-radius: 999px;
    padding: 2px 10px;
    font-size: 0.75rem;
    font-weight: 700;
  }
  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .table-wrap { overflow-x: auto; }
</style>
</head>
<body>
<h1>📦 Escáner de Inventario</h1>

<div class="card">
  <label>URL de Google Sheets (Apps Script /exec)</label>
  <div style="display:flex; gap:8px;">
    <input type="text" id="sheetUrl" placeholder="https://script.google.com/macros/s/XXXX/exec">
    <button id="saveSheetUrl" class="btn-primary" style="flex:0 0 auto; padding:8px 14px;">Guardar</button>
  </div>
  <div class="status" id="sheetStatus">No configurado. Los datos solo se guardan en este celular.</div>
</div>

<div class="card">
  <div class="origen-row">
    <div>
      <label>Origen de salida</label>
      <select id="origenSalida"></select>
    </div>
    <div>
      <label>Origen de entrada</label>
      <select id="origenEntrada"></select>
    </div>
  </div>
</div>

<div class="card">
  <div id="reader"></div>
  <div class="controls">
    <button id="startBtn" class="btn-primary">Iniciar cámara</button>
    <button id="stopBtn" class="btn-secondary" disabled>Detener</button>
  </div>
  <div class="status" id="status">Presiona "Iniciar cámara" y apunta al código de barras.</div>
</div>

<div class="card">
  <div class="card-header">
    <strong>Inventario</strong>
    <span class="count-badge" id="countBadge">0 items</span>
  </div>
  <div class="table-wrap">
    <table id="invTable">
      <thead>
        <tr>
          <th>Código</th>
          <th>Origen salida</th>
          <th>Origen entrada</th>
          <th>Cant.</th>
          <th>Stock</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="invBody"></tbody>
    </table>
  </div>
  <div class="empty-msg" id="emptyMsg">Aún no has escaneado nada.</div>

  <div class="export-row">
    <button id="saveOrderBtn" class="btn-primary">💾 Guardar pedido</button>
  </div>
</div>

<script>
const STORAGE_KEY = 'inventario_escaner_v2';
const ORIGENES = ['TIENDA DE ANCASH', 'TIENDA DE CAJAMARCA', 'TIENDA DE MANTARO', 'ALMACÉN GENERAL'];

let items = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
let html5QrCode = null;
let scanning = false;
let lastScan = { code: null, time: 0 };

const invBody = document.getElementById('invBody');
const emptyMsg = document.getElementById('emptyMsg');
const countBadge = document.getElementById('countBadge');
const statusEl = document.getElementById('status');
const origenSalidaSel = document.getElementById('origenSalida');
const origenEntradaSel = document.getElementById('origenEntrada');
const sheetUrlInput = document.getElementById('sheetUrl');
const sheetStatus = document.getElementById('sheetStatus');
const saveOrderBtn = document.getElementById('saveOrderBtn');

const SHEET_URL_KEY = 'inventario_sheet_url';
const DEFAULT_SHEET_URL = 'https://script.google.com/macros/s/AKfycbzdWFB8w0460cNdqjTbpc8_Xuo0iTOcwm7dCKLc0TtEFAE_iBy_GoLeMLkNr_qa6-3G/exec';
let sheetUrl = localStorage.getItem(SHEET_URL_KEY) || DEFAULT_SHEET_URL;
sheetUrlInput.value = sheetUrl;
updateSheetStatus('idle');

function updateSheetStatus(state) {
  if (!sheetUrl) { sheetStatus.textContent = 'No configurado. Los datos solo se guardan en este celular.'; return; }
  if (state === 'syncing') sheetStatus.textContent = 'Sincronizando con Google Sheets...';
  else if (state === 'ok') sheetStatus.textContent = '✅ Sincronizado con Google Sheets.';
  else if (state === 'error') sheetStatus.textContent = '⚠️ No se pudo sincronizar (revisa la URL o tu conexión).';
  else sheetStatus.textContent = 'Conectado a Google Sheets.';
}

document.getElementById('saveSheetUrl').addEventListener('click', () => {
  sheetUrl = sheetUrlInput.value.trim();
  localStorage.setItem(SHEET_URL_KEY, sheetUrl);
  updateSheetStatus('idle');
  if (sheetUrl) syncToSheet(sheetUrl);
});

let syncTimer = null;
function scheduleSync() {
  if (!sheetUrl) { updateSheetStatus('idle'); return; }
  clearTimeout(syncTimer);
  syncTimer = setTimeout(function () { syncToSheet(sheetUrl); }, 800);
}

async function syncToSheet(url) {
  if (!url) return false;
  updateSheetStatus('syncing');
  try {
    await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ items: items })
    });
    updateSheetStatus('ok');
    return true;
  } catch (err) {
    updateSheetStatus('error');
    return false;
  }
}

function fillOrigenSelect(sel) {
  sel.innerHTML = ORIGENES.map(function (o) { return '<option value="' + o + '">' + o + '</option>'; }).join('');
}
fillOrigenSelect(origenSalidaSel);
fillOrigenSelect(origenEntradaSel);
origenEntradaSel.selectedIndex = 1;

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
  scheduleSync();
}

function origenOptionsHtml(selected) {
  return ORIGENES.map(function (o) {
    return '<option value="' + o + '" ' + (o === selected ? 'selected' : '') + '>' + o + '</option>';
  }).join('');
}

function render() {
  invBody.innerHTML = '';
  emptyMsg.style.display = items.length === 0 ? 'block' : 'none';
  items.forEach(function (item, idx) {
    const tr = document.createElement('tr');
    tr.innerHTML =
      '<td>' + item.code + '</td>' +
      '<td><select data-idx="' + idx + '" data-field="origenSalida">' + origenOptionsHtml(item.origenSalida) + '</select></td>' +
      '<td><select data-idx="' + idx + '" data-field="origenEntrada">' + origenOptionsHtml(item.origenEntrada) + '</select></td>' +
      '<td style="width:60px;"><input type="number" min="0" value="' + item.qty + '" data-idx="' + idx + '" data-field="qty" /></td>' +
      '<td style="width:60px;"><input type="number" min="0" value="' + item.stock + '" data-idx="' + idx + '" data-field="stock" /></td>' +
      '<td><button class="del-btn" data-idx="' + idx + '">✕</button></td>';
    invBody.appendChild(tr);
  });
  countBadge.textContent = items.length + (items.length === 1 ? ' item' : ' items');
}

invBody.addEventListener('input', function (e) {
  const idx = e.target.getAttribute('data-idx');
  const field = e.target.getAttribute('data-field');
  if (idx === null) return;
  if (field === 'qty' || field === 'stock') items[idx][field] = parseInt(e.target.value) || 0;
  else items[idx][field] = e.target.value;
  save();
});

invBody.addEventListener('change', function (e) {
  const idx = e.target.getAttribute('data-idx');
  const field = e.target.getAttribute('data-field');
  if (idx === null || e.target.tagName !== 'SELECT') return;
  items[idx][field] = e.target.value;
  save();
});

invBody.addEventListener('click', function (e) {
  if (e.target.classList.contains('del-btn')) {
    const idx = e.target.getAttribute('data-idx');
    items.splice(idx, 1);
    save();
    render();
  }
});

function addScan(code) {
  const now = Date.now();
  if (code === lastScan.code && now - lastScan.time < 2000) return;
  lastScan = { code: code, time: now };

  const origenSalida = origenSalidaSel.value;
  const origenEntrada = origenEntradaSel.value;

  const existing = items.find(function (i) {
    return i.code === code && i.origenSalida === origenSalida && i.origenEntrada === origenEntrada;
  });
  if (existing) {
    existing.qty++;
    statusEl.textContent = 'Código ya existía, cantidad +1: ' + code;
  } else {
    items.push({ code: code, origenSalida: origenSalida, origenEntrada: origenEntrada, qty: 1, stock: 0 });
    statusEl.textContent = 'Código escaneado: ' + code;
  }
  save();
  render();
  if (navigator.vibrate) navigator.vibrate(100);
}

document.getElementById('startBtn').addEventListener('click', async function () {
  if (scanning) return;
  html5QrCode = new Html5Qrcode("reader");
  try {
    await html5QrCode.start(
      { facingMode: "environment" },
      {
        fps: 10,
        qrbox: { width: 250, height: 150 },
        formatsToSupport: [
          Html5QrcodeSupportedFormats.EAN_13,
          Html5QrcodeSupportedFormats.EAN_8,
          Html5QrcodeSupportedFormats.UPC_A,
          Html5QrcodeSupportedFormats.UPC_E,
          Html5QrcodeSupportedFormats.CODE_128,
          Html5QrcodeSupportedFormats.CODE_39,
          Html5QrcodeSupportedFormats.QR_CODE
        ]
      },
      function (decodedText) { addScan(decodedText); }
    );
    scanning = true;
    document.getElementById('startBtn').disabled = true;
    document.getElementById('stopBtn').disabled = false;
    statusEl.textContent = 'Cámara activa. Apunta al código de barras.';
  } catch (err) {
    statusEl.textContent = 'No se pudo acceder a la cámara: ' + err;
  }
});

document.getElementById('stopBtn').addEventListener('click', async function () {
  if (html5QrCode && scanning) {
    await html5QrCode.stop();
    html5QrCode.clear();
    scanning = false;
    document.getElementById('startBtn').disabled = false;
    document.getElementById('stopBtn').disabled = true;
    statusEl.textContent = 'Cámara detenida.';
  }
});

saveOrderBtn.addEventListener('click', async function () {
  if (items.length === 0) {
    statusEl.textContent = 'No hay items para guardar.';
    return;
  }
  saveOrderBtn.disabled = true;
  const originalText = saveOrderBtn.textContent;
  saveOrderBtn.textContent = 'Guardando...';
  let ok = true;
  if (sheetUrl) {
    ok = await syncToSheet(sheetUrl);
  }
  if (ok) {
    items = [];
    save();
    render();
    statusEl.textContent = '✅ Pedido guardado en Google Drive. Sistema listo para un nuevo pedido.';
  } else {
    statusEl.textContent = '⚠️ No se pudo guardar en Google Drive. Intenta nuevamente antes de reiniciar.';
  }
  saveOrderBtn.disabled = false;
  saveOrderBtn.textContent = originalText;
});

render();
</script>
</body>
</html>
