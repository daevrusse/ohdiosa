<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#E0457B">
<title>Pedidos Oh Diosa</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --ground:#FBF7FA; --surface:#FFFFFF; --sunk:#F3ECF1; --line:#E6DBE3;
  --ink:#2A1E2C; --muted:#6E5F72; --faint:#9A8C9D;
  --accent:#B3315F; --accent-ink:#FFFFFF; --accent-soft:#F8E3EB;
  --pend:#A86A0B; --pend-bg:#FCF1DC;
  --ruta:#2360A5; --ruta-bg:#E1ECF9;
  --ok:#23794D; --ok-bg:#DFF2E7;
  --danger:#B42318;
  --shadow:0 1px 2px rgba(60,20,50,.06),0 6px 20px rgba(60,20,50,.06);
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#171217; --surface:#211A22; --sunk:#2A222B; --line:#3A2F3B;
    --ink:#F3EAF1; --muted:#B9A9BA; --faint:#8A7B8C;
    --accent:#E8628F; --accent-ink:#1B0F15; --accent-soft:#3D2230;
    --pend:#F0B24A; --pend-bg:#3A2C12; --ruta:#7DB3F0; --ruta-bg:#172A42; --ok:#6BD39B; --ok-bg:#15352A;
    --danger:#F97066; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#171217; --surface:#211A22; --sunk:#2A222B; --line:#3A2F3B;
  --ink:#F3EAF1; --muted:#B9A9BA; --faint:#8A7B8C;
  --accent:#E8628F; --accent-ink:#1B0F15; --accent-soft:#3D2230;
  --pend:#F0B24A; --pend-bg:#3A2C12; --ruta:#7DB3F0; --ruta-bg:#172A42; --ok:#6BD39B; --ok-bg:#15352A;
  --danger:#F97066; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font:15px/1.45 var(--body);padding-inline:16px;padding-block:0 48px}
.wrap{max-width:760px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ground);margin-inline:-16px;padding:14px 16px 0;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{font:800 24px/1 var(--display);letter-spacing:-.02em;margin:0}
.brand h1 em{font-style:normal;color:var(--accent)}
.brand .sub{color:var(--muted);font-size:13px}
.conn{margin-left:auto;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.dot.on{background:var(--ok)} .dot.off{background:var(--danger)}
nav.tabs{display:flex;gap:4px;margin-top:12px}
nav.tabs button{background:none;border:0;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;display:flex;align-items:center;gap:8px}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.badge{background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700;border-radius:999px;padding:1px 7px;min-width:20px;text-align:center}

.banner{margin-top:16px;padding:12px 14px;border-radius:10px;background:var(--pend-bg);color:var(--ink);font-size:14px;border:1px solid var(--line)}
section.view{padding-top:20px;display:grid;gap:22px}
.field{display:grid;gap:8px}
.label{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg button{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 8px;cursor:pointer;font-weight:600;display:grid;gap:2px;justify-items:center}
.seg button small{font:500 11px var(--mono);color:var(--faint)}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.seg button[aria-pressed="true"] small{color:var(--accent)}
input[type=text],input[type=search],textarea,select{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{min-height:64px;resize:vertical}

.search{position:relative}
.search input{padding-left:42px;font-size:16px}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--faint)}
.results{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;max-height:420px;overflow-y:auto}
.res{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0}
.res:last-child{border-bottom:0}
.res:hover,.res.hl{background:var(--sunk)}
.res .n{font-weight:600}
.res mark{background:var(--accent-soft);color:inherit;border-radius:3px;padding:0 1px}
.res .meta{grid-column:1;font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.res .code{font-family:var(--mono);font-size:11.5px}
.res .add{grid-row:1/3;grid-column:2;align-self:center;color:var(--accent);font-weight:700;font-size:13px}
.res.inlist .add{color:var(--ok)}
.empty-res{padding:14px;color:var(--muted);font-size:14px}

.cart{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.cart-head{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--sunk)}
.cart-head strong{font:700 15px var(--display)}
.cart-head span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.line{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.line .n{font-weight:600;font-size:14px}
.line .code{font:500 11.5px var(--mono);color:var(--faint)}
.qty{display:flex;align-items:center;gap:2px;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.qty button{width:34px;height:34px;border:0;background:var(--sunk);cursor:pointer;font-size:18px;font-weight:600}
.qty input{width:48px;border:0;border-radius:0;text-align:center;padding:6px 2px;font-variant-numeric:tabular-nums;font-weight:700}
.ctrl{display:flex;align-items:center;gap:8px}
.rm{width:38px;height:38px;display:grid;place-items:center;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--muted);cursor:pointer;transition:background .15s,color .15s,border-color .15s}
.rm:hover,.rm:focus-visible{background:var(--accent-soft);color:var(--danger);border-color:var(--danger)}
.stkl{font-size:12px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.stkl.low{color:var(--danger);font-weight:600}
.res .stkr{font-weight:600;color:var(--ok);font-variant-numeric:tabular-nums}
.res .stkr.zero{color:var(--danger)}
.cart-empty{padding:22px 14px;color:var(--muted);font-size:14px;text-align:center}

.btn{border:0;border-radius:12px;padding:14px 18px;font-weight:700;cursor:pointer;background:var(--accent);color:var(--accent-ink);font-size:16px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
.btn.sm{padding:9px 12px;font-size:14px;border-radius:10px}
.hint{font-size:13px;color:var(--muted)}
.err{color:var(--danger);font-size:14px;font-weight:600}

.done{background:var(--surface);border:1.5px solid var(--ok);border-radius:16px;padding:22px;display:grid;gap:10px;justify-items:start}
.done .num{font:700 40px/1 var(--mono);letter-spacing:-.02em;color:var(--ink)}
.done p{margin:0;color:var(--muted)}

.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer;display:flex;gap:6px;align-items:center}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.chip .c{font-variant-numeric:tabular-nums;opacity:.7}
.filters select,.filters input{width:auto;flex:1 1 150px;padding:8px 12px;border-radius:999px;font-size:14px}

.tickets{display:grid;gap:12px}
.ticket{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.ticket.s-pendiente{border-left:5px solid var(--pend)}
.ticket.s-en_camino{border-left:5px solid var(--ruta)}
.ticket.s-entregado{border-left:5px solid var(--ok)}
.t-head{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;padding:12px 14px}
.t-num{font:700 18px var(--mono)}
.t-who{font-size:13px;color:var(--muted)}
.t-who b{color:var(--ink);font-weight:600}
.pill{margin-left:auto;font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px;white-space:nowrap}
.pill.pendiente{background:var(--pend-bg);color:var(--pend)}
.pill.en_camino{background:var(--ruta-bg);color:var(--ruta)}
.pill.entregado{background:var(--ok-bg);color:var(--ok)}
.t-items{border-top:1px solid var(--line);padding:4px 0}
.t-it{display:grid;grid-template-columns:44px 1fr auto;gap:10px;padding:6px 14px;align-items:baseline}
.t-it .q{font:700 15px var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.t-it .n{font-size:14px}
.t-it .code{font:500 11px var(--mono);color:var(--faint)}
.t-it .stk{font-size:11.5px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.t-it .stk.low{color:var(--danger);font-weight:600}
.t-note{padding:8px 14px;font-size:13px;color:var(--muted);border-top:1px dashed var(--line)}
.t-foot{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:10px 14px;background:var(--sunk);border-top:1px solid var(--line)}
.t-time{font-size:12px;color:var(--muted);display:grid;gap:2px}
.t-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.dl-btn{background:var(--accent);color:var(--accent-ink);border:0;font-weight:700;font-size:14px;padding:10px 16px;border-radius:999px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}.dl-btn:disabled{opacity:.6}
.linkish{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:13px}
.none{padding:30px 10px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.ticket{transition:border-color .2s}}

.stack{display:grid;gap:22px}.stack-sm{display:grid;gap:8px}.row{display:flex;gap:8px;flex-wrap:wrap}
.tabnote{padding:10px 0;font-weight:600;color:var(--ink);border-bottom:3px solid var(--accent)}
nav.tabs{align-items:center}
.login{max-width:380px;display:grid;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow)}
.login p{margin:0}
.login input{font-size:20px;letter-spacing:.3em;text-align:center;font-family:var(--mono)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:2px}
.kpi .kv{font:800 28px/1 var(--display);font-variant-numeric:tabular-nums}
.kpi .kl{font-size:12px;color:var(--muted);font-weight:600}
.kpi.pend .kv{color:var(--pend)}.kpi.ruta .kv{color:var(--ruta)}.kpi.ok .kv{color:var(--ok)}

/* ---- visual v2 ---- */
:root{--avbgS:85%;--avbgL:91%;--avfgS:60%;--avfgL:30%}
.av{--h:330;width:42px;height:42px;border-radius:13px;display:grid;place-items:center;flex:none;font:800 14px/1 var(--display);letter-spacing:.02em;color:hsl(var(--h) var(--avfgS) var(--avfgL));background:linear-gradient(145deg,hsl(var(--h) var(--avbgS) var(--avbgL)),hsl(calc(var(--h) + 24) var(--avbgS) calc(var(--avbgL) - 6%)))}
.av.sm{width:30px;height:30px;border-radius:9px;font-size:11px}
.av.lg{width:46px;height:46px;border-radius:14px;font-size:16px}
.logo{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--accent),#E8628F);color:#fff;font:800 14px var(--display);align-self:center;box-shadow:0 4px 12px rgba(179,49,95,.35)}
.brand h1{display:flex;align-items:center;gap:10px}
.s-pendiente{--c:var(--pend)}.s-en_camino{--c:var(--ruta)}.s-entregado{--c:var(--ok)}
.steps{display:flex;align-items:center;padding:0 14px 12px}
.stp{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--faint);white-space:nowrap}
.stp i{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:11px;line-height:1}
.stp.on{color:var(--ink)}.stp.on i{background:var(--c);border-color:var(--c);color:#fff}
.stp-line{flex:1;min-width:10px;height:3px;border-radius:2px;background:var(--line);margin:0 8px}.stp-line.on{background:var(--c)}
.t-who{display:flex;align-items:center;gap:8px}
.t-it{grid-template-columns:44px 30px 1fr auto!important;align-items:center!important}
.t-it .q{font-size:16px}
.ticket{transition:transform .15s}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--avbgS:40%;--avbgL:24%;--avfgS:85%;--avfgL:84%}}
:root[data-theme="dark"]{--avbgS:40%;--avbgL:24%;--avfgS:85%;--avfgL:84%}

.seg button{padding:14px 8px 12px;gap:6px}
.seg button .av{width:38px;height:38px;border-radius:50%;font-size:16px}
.seg button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--accent-soft)}
.brands{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;margin-inline:-2px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.brands .chip{flex:none;padding:6px 12px 6px 6px}
.brands .chip .av{width:24px;height:24px;border-radius:50%;font-size:10px}
.brands .chip.all{padding-left:12px}
.browse-title{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--muted);padding:2px 2px 0}
.browse-title b{color:var(--ink);font:700 15px var(--display)}
.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;background:none;border:0;box-shadow:none;overflow:visible;max-height:none;padding:0}
.res{display:flex!important;align-items:center;gap:12px;background:var(--surface)!important;border:1.5px solid var(--line)!important;border-radius:14px;padding:10px 12px!important;min-height:72px;position:relative;transition:border-color .15s,transform .1s}
.res:hover,.res.hl{border-color:var(--accent)!important;transform:translateY(-1px)}
.res.inlist{border-color:var(--ok)!important;background:var(--ok-bg)!important}
.res .body{display:grid;gap:3px;min-width:0;flex:1;text-align:left}
.res .n{font-size:14px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.res .meta{display:flex;gap:6px 8px;align-items:center;font-size:11.5px}
.res .add{position:static!important;grid-row:auto!important;display:grid;place-items:center;min-width:34px;height:34px;padding:0 8px;border-radius:10px;background:var(--accent);color:var(--accent-ink)!important;font-weight:800;font-size:16px}
.res.inlist .add{background:var(--ok);font-size:13px}
.stkb{font:600 11px var(--mono);padding:2px 7px;border-radius:999px;background:var(--ok-bg);color:var(--ok)}
.stkb.low{background:var(--pend-bg);color:var(--pend)}.stkb.zero{background:var(--sunk);color:var(--faint)}
.more{grid-column:1/-1}
.empty-res{grid-column:1/-1;background:var(--surface);border:1.5px dashed var(--line);border-radius:14px;text-align:center;padding:22px}
.line{grid-template-columns:auto 1fr auto!important}
.line .av{width:44px;height:44px}
.cart-empty{display:grid;justify-items:center;gap:8px;padding:28px 14px}
.cart-empty svg{color:var(--accent);opacity:.55}
.done{border-color:var(--ok);background:linear-gradient(180deg,var(--ok-bg),var(--surface) 70%)}
.done .tick{width:56px;height:56px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;box-shadow:0 6px 18px rgba(35,121,77,.35)}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;align-items:center;gap:12px;box-shadow:0 -6px 20px rgba(60,20,50,.08)}
.bar .wrapbar{max-width:760px;margin:0 auto;width:100%;display:flex;align-items:center;gap:12px}
.bar .sum{display:grid;line-height:1.2}.bar .sum b{font:800 18px var(--display)}.bar .sum span{font-size:12px;color:var(--muted)}
.bar .btn{margin-left:auto}
body{padding-bottom:96px}

/* ---- design v4 · blush minimal ---- */
:root,:root:not([data-theme="light"]){--ground:#FFF8F9;--surface:#FFFFFF;--sunk:#FDEEF1;--line:#F3DDE2;--ink:#2D2326;--muted:#7A6A6F;--faint:#A18F95;--accent:#E0457B;--accent-ink:#FFFFFF;--accent-soft:#FDE6EC;--gold:#E0457B;--ok:#1F8A5B;--ok-bg:#E3F5EC;--pend:#B0701A;--pend-bg:#FFF0D6;--display:"Plus Jakarta Sans",system-ui,sans-serif;--body:"Plus Jakarta Sans",system-ui,sans-serif;--shadow:0 1px 2px #e0457b10,0 10px 30px -18px #e0457b55}
body{background:#FFF8F9}body::before{display:none}
header.top{background:#FFF8F9ee;border-bottom:1px solid #F3DDE2;backdrop-filter:blur(8px)}
.brand h1{font:700 21px/1 var(--display);letter-spacing:-.025em}
.brand h1 em{font-style:normal;color:#E0457B}
.logo{width:30px;height:30px;font:700 12px var(--display);font-style:normal;background:#E0457B;box-shadow:none;border-radius:10px;color:#fff}
.brand .sub{font-weight:500;letter-spacing:0;text-transform:none;font-size:12px;order:0;flex-basis:auto}
nav.tabs button{font-weight:600}nav.tabs button[aria-selected="true"]{border-bottom-color:#E0457B;color:#2D2326}
.field>.label{font-weight:600;letter-spacing:.06em;text-transform:none;font-size:13px;color:#2D2326}
.field>.label::before{display:none}
.seg{gap:8px}
.seg button{border:1.5px solid #F3DDE2;border-radius:16px;background:#fff;font-weight:600;font-family:var(--body);font-size:15px;padding:14px 8px;box-shadow:none}
.seg button .av{width:28px;height:28px;border-radius:50%;font-size:11px;background:#FDE6EC;color:#E0457B}
.seg button[aria-pressed="true"]{border-color:#E0457B;background:#FDE6EC;color:#2D2326;box-shadow:none}.seg button[aria-pressed="true"] small{color:#E0457B}
input[type=text],input[type=search]{border-radius:999px;border:1.5px solid #F3DDE2;background:#fff;padding-left:44px}
input[type=text]{padding-left:18px}
.chip{border-radius:999px;border:1.5px solid #F3DDE2;background:#fff;font-weight:600;font-size:12.5px}.chip .av{display:none}.brands .chip{padding:6px 14px}
.chip[aria-pressed="true"]{background:#E0457B;color:#fff;border-color:#E0457B}
.results{grid-template-columns:1fr;gap:8px}
.res{border:1.5px solid #F3DDE2!important;border-radius:18px;background:#fff!important;box-shadow:none;min-height:0;padding:12px 14px!important}
.res:hover,.res.hl{border-color:#E0457B!important;transform:none}
.res.inlist{background:#FDE6EC!important;border-color:#E0457B!important}
.av{border-radius:12px;background:#FDE6EC;color:#E0457B;width:38px;height:38px}
.res .n{font:600 14.5px/1.25 var(--body)}
.stkb{background:#E3F5EC;color:#1F8A5B;font-weight:600}
.res .add{border-radius:50%;width:34px;height:34px;background:#E0457B;box-shadow:none;font-size:18px}
.res.inlist .add{width:auto}
.cart,.ticket,.done,.kpi,.login{border-radius:20px;border:1.5px solid #F3DDE2;background:#fff;box-shadow:none}
.cart-head{background:#FFF8F9}.cart-head strong,.browse-title b{font:700 15px var(--display)}
.btn{border-radius:999px;background:#2D2326;color:#fff;font-weight:600;box-shadow:none}.btn.ghost{background:#fff;color:#2D2326;border:1.5px solid #F3DDE2}
#enviar,.bar .btn{background:#E0457B;color:#fff;box-shadow:0 12px 24px -12px #E0457B}
.bar{background:#fff;color:#2D2326;border-top:1px solid #F3DDE2;box-shadow:none}.bar .sum span{color:#A18F95}.bar .sum b{font:700 18px var(--display)}
.done .num,.t-num{font-family:var(--display);font-weight:700}

/* ---- pedido: cantidades y número de atención ---- */
.brands,.browse-title{display:none}
.results:empty{display:none}
.line{grid-template-columns:auto 1fr!important;align-items:start!important;gap:10px 12px!important}
.line .ctrl{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:10px}
.qty{border:1.5px solid #F3DDE2;border-radius:999px;background:#fff}
.qty button{width:44px;height:44px;border-radius:0;background:#FDE6EC;color:#E0457B;font-size:22px;font-weight:700}
.qty button:first-child{border-radius:999px 0 0 999px}.qty button:last-child{border-radius:0 999px 999px 0}
.qty input{width:56px;height:44px;font-size:17px}
.rm{width:auto;height:44px;padding:0 16px;gap:8px;display:inline-flex;align-items:center;border-radius:999px;color:#B42318;border-color:#F3C9C4;font-weight:600;font-size:14px}
.rm:hover,.rm:focus-visible{background:#FDECEA;border-color:#B42318}
.done .num{font-size:52px;letter-spacing:.02em}

@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:no-preference){
  .results.fresh .res{animation:rise .4s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0)*30ms)}
  .tickets>.ticket{animation:rise .4s cubic-bezier(.2,.7,.2,1) both}
  .done .tick{animation:pop .5s cubic-bezier(.3,1.4,.5,1) both}
}
</style>
<style>html{color-scheme:light}body{margin:0;padding-top:env(safe-area-inset-top,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
</head><body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1><span class="logo">od</span><span>Oh Diosa <em>Pedidos</em></span></h1>
      <span class="sub">Pide reposición al almacén</span>
      <span class="conn"><span class="dot" id="connDot"></span><span id="connTxt">Listo</span></span>
    </div>
    <nav class="tabs" role="tablist">
      <button role="tab" id="tabNuevo" aria-selected="true">Nuevo pedido</button>
      <button role="tab" id="tabMis" aria-selected="false">Mis pedidos <span class="badge" id="pendBadge" hidden>0</span></button>
      <button class="linkish" id="uSalir2" type="button" hidden style="margin-left:auto;align-self:center">Cerrar sesión</button>
    </nav>
  </header>

  <section class="view" id="viewNuevo">
    <div id="formArea" class="stack">
      <div class="field" id="loginBox">
        <span class="label">Entra con tu usuario</span>
        <select id="uSel" aria-label="Tu nombre"><option value="">Elige tu nombre</option></select>
        <input type="password" id="uPin" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="Tu clave (solo números)" style="width:100%;box-sizing:border-box;background:#fff;border:1.5px solid #F3DDE2;border-radius:999px;padding:12px 18px;outline:none">
        <button class="btn" id="uEntrar" type="button">Entrar</button>
        <span class="err" id="uErr" hidden></span>
        <span class="hint">Si no apareces en la lista o olvidaste tu clave, pídesela al administrador.</span>
      </div>
      <div class="field" id="userBar" hidden>
        <span class="label">Vendedora</span>
        <div><b id="uNom"></b> · <span id="uTienda"></span> &nbsp;<button class="linkish" id="uSalir" type="button">Cerrar sesión</button></div>
      </div>
      <div class="field" id="pedidoBox" hidden>
        <label class="label" for="q">Buscar producto</label>
        <div class="search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input type="search" id="q" autocomplete="off" placeholder="Nombre, marca o código de barras">
        </div>
        <div class="browse-title" id="browseTitle"></div>
        <div class="results" id="results"></div>
        <span class="hint" id="catHint">Cargando catálogo…</span>
      </div>
      <div class="cart" id="cart"></div>
      <div class="stack-sm">
        <button class="btn" id="enviar" disabled>Enviar pedido</button>
        <span class="err" id="sendErr" hidden></span>
        <span class="hint" id="sendHint"></span>
      </div>
    </div>
    <div class="done" id="doneArea" hidden>
      <span class="tick"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span>
      <span class="label">Pedido enviado · Tu número de atención</span>
      <div class="num" id="doneNum"></div>
      <p id="doneTxt"></p>
      <div class="row">
        <button class="btn sm" id="copiar">Copiar número</button>
        <button class="btn sm ghost" id="otro">Hacer otro pedido</button>
        <button class="btn sm ghost" id="verMis">Ver mis pedidos</button>
      </div>
    </div>
  </section>

  <section class="view" id="viewMis" hidden>
    <div class="filters">
      <span class="hint" id="misTienda"></span>
      <button class="btn sm ghost" id="refrescar" style="margin-left:auto">Actualizar</button>
    </div>
    <div class="filters" id="estadoChips"></div>
    <div class="tickets" id="ticketList"></div>
  </section>
</div>
<div class="bar" id="bar" hidden><div class="wrapbar"><div class="sum"><b id="barN">0 unid.</b><span id="barS"></span></div><button class="btn" id="barBtn">Revisar y enviar</button></div></div>

<script>
const API="https://script.google.com/macros/s/AKfycbzMsg4QAbVRZlhnxHmFy14Ef3CtaTwKhLTvL2Qc3FFSDQazr44gHSr2uJWR_kzPhJ5V/exec";
const TIENDAS=[{id:"CAJ",nombre:"Cajamarca"},{id:"MAN",nombre:"Mantaro"},{id:"ANC",nombre:"Ancash"}];
const ESTADOS={pendiente:"Pendiente",en_camino:"En camino",entregado:"Entregado"};
const $=id=>document.getElementById(id);
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");

const hue=s=>{let h=0;for(const ch of String(s||"?"))h=(h*31+ch.charCodeAt(0))%360;return h};
const initials=s=>{const w=String(s||"").trim().split(/[\s&.]+/).filter(Boolean);return((w[0]||"?")[0]+(w[1]?w[1][0]:"")).toUpperCase()};
const avatar=(it,cls="")=>{const k=(it.m&&it.m!=="OTRO")?it.m:it.n;return `<span class="av ${cls}" style="--h:${hue(k)}" aria-hidden="true">${esc(initials(k))}</span>`};
const storeAv=(id,nombre,cls="")=>`<span class="av ${cls}" style="--h:${({CAJ:340,MAN:205,ANC:150})[id]??300}" aria-hidden="true">${esc((nombre||id||"?")[0])}</span>`;
const stepsHTML=e=>{const o=["pendiente","en_camino","entregado"],i=o.indexOf(e);
  return `<div class="steps">${o.map((k,j)=>`${j?`<span class="stp-line${j<=i?" on":""}"></span>`:""}<span class="stp${j<=i?" on":""}"><i>${j<=i?"✓":""}</i>${ESTADOS[k]}</span>`).join("")}</div>`};
const fmt=t=>t?new Date(t).toLocaleString("es-PE",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"}):"";

async function apiGet(params){
  const r=await fetch(API+"?"+new URLSearchParams(params),{cache:"no-store"});
  const j=await r.json(); if(!j.ok) throw new Error(j.error||"Error del servidor"); return j;
}
async function apiPost(body){
  const r=await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)});
  return r.json();
}

let catalog=[],idx=[],byKey=new Map(),onCatalog=()=>{};
const loadCat=()=>Promise.race([apiGet({action:"catalogo"}),new Promise((_,rj)=>setTimeout(rj,7000))]).then(j=>{if(!j.filas||!j.filas.length)throw 0;window.baseFecha=j.fecha;return j.filas;})
  .catch(()=>fetch("catalogo.json",{cache:"no-cache"}).then(r=>r.json()));
loadCat().then(rows=>{
  catalog=rows.map(r=>({c:r[0],n:r[1],m:r[2],p:r[3],s:r[4]}));
  idx=catalog.map(p=>({p,t:norm(p.n+" "+p.m),c:norm(p.c)}));
  catalog.forEach(p=>byKey.set(p.c+"|"+p.n,p));
  onCatalog(true);
}).catch(()=>onCatalog(false));
const stockOf=it=>{const cp=byKey.get(it.c+"|"+it.n);return cp?cp.s:null;};

function setConn(state,txt){$("connDot").className="dot "+state;$("connTxt").textContent=txt;}

/* Render de un ticket. actions(p) devuelve HTML de botones (admin) o "" (vendedoras). */
function ticketHTML(p,actions,showStock){
  const units=p.items.reduce((a,b)=>a+(b.q||0),0);
  const last=(p.hist||[]).slice(-1)[0];
  return `<article class="ticket s-${p.estado}">
    <div class="t-head">
      <span class="t-num">${esc(p.num)}</span>
      <span class="t-who">${storeAv(p.tienda,p.tiendaNombre,"sm")}<span><b>${esc(p.tiendaNombre)}</b> · ${esc(p.vendedora)}</span></span>
      <span class="pill ${p.estado}">${ESTADOS[p.estado]||esc(p.estado)}</span>
    </div>
    ${stepsHTML(p.estado)}
    <div class="t-items">${p.items.map(it=>{
      let stk="";
      if(showStock){const s=stockOf(it);stk=s==null?`<span class="stk">Almacén: —</span>`:`<span class="stk${s<it.q?" low":""}">Almacén: ${s}</span>`;}
      return `<div class="t-it"><span class="q">${it.q}×</span>${avatar(it,"sm")}<div><div class="n">${esc(it.n)}</div><div class="code">${esc(it.c)}${it.m?" · "+esc(it.m):""}</div></div>${stk}</div>`;}).join("")}</div>
    <div class="t-foot">
      <div class="t-time"><span>Pedido ${fmt(p.creado)} · ${p.items.length} prod. / ${units} unid.</span>${p.estado!=="pendiente"&&last?`<span>${ESTADOS[p.estado]} ${fmt(last.t)}</span>`:""}</div>
      <div class="t-actions">${actions?actions(p):""}</div>
    </div>
  </article>`;
}

function loadXLSX(){return window.XLSX?Promise.resolve():new Promise((ok,no)=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";s.onload=ok;s.onerror=no;document.head.appendChild(s);});}
async function descargar(num,btn){
  const p=pedidos.find(x=>x.num===num);if(!p)return;
  const t0=btn&&btn.textContent;if(btn){btn.disabled=true;btn.textContent="Preparando…";}
  try{
    await loadXLSX();
    const units=p.items.reduce((a,b)=>a+(b.q||0),0);
    const rows=[["N° de atención",p.num],["Tienda",p.tiendaNombre],["Vendedora",p.vendedora],["Estado",ESTADOS[p.estado]||p.estado],["Fecha del pedido",fmt(p.creado)],[],["Código","Producto","Marca","Cantidad"]].concat(p.items.map(i=>[String(i.c),i.n,i.m||"",i.q]),[[],["","","Total unidades",units]]);
    const ws=XLSX.utils.aoa_to_sheet(rows);ws["!cols"]=[{wch:16},{wch:50},{wch:18},{wch:10}];
    const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Pedido");
    XLSX.writeFile(wb,p.num+".xlsx");
  }catch(e){alert("No se pudo generar el archivo. Revisa tu internet e intenta de nuevo.");}
  finally{if(btn){btn.disabled=false;btn.textContent=t0;}}
}
document.addEventListener("click",e=>{const b=e.target.closest("[data-dl]");if(b)descargar(b.dataset.dl,b);});

let tienda="",sess=null;
try{sess=JSON.parse(store.get("od_user")||"null");}catch(e){sess=null;}
if(sess&&sess.id)tienda=sess.tienda;
let cart=[], pedidos=[], fEstado="activos", cargado=false;

function showTab(t){
  const nuevo=t==="nuevo";
  $("tabNuevo").setAttribute("aria-selected",nuevo);$("tabMis").setAttribute("aria-selected",!nuevo);
  $("viewNuevo").hidden=!nuevo;$("viewMis").hidden=nuevo;refreshBar();
  if(!nuevo) cargar();
}
$("tabNuevo").onclick=()=>showTab("nuevo");
$("tabMis").onclick=()=>showTab("mis");

function paintUser(){
  const on=!!(sess&&sess.id);
  $("uSalir2").hidden=!on;$("loginBox").hidden=on;$("userBar").hidden=!on;$("pedidoBox").hidden=!on;
  $("cart").hidden=!on;$("enviar").closest(".stack-sm").hidden=!on;
  if(on){const t=TIENDAS.find(x=>x.id===sess.tienda);$("uNom").textContent=sess.nombre;$("uTienda").textContent=t?t.nombre:sess.tienda;}
  tienda=on?sess.tienda:"";validate();
}
async function cargarUsuarios(){
  try{const j=await apiGet({action:"usuarios"});
    const sel=$("uSel");sel.innerHTML='<option value="">Elige tu nombre</option>'+(j.usuarios||[]).map(u=>`<option value="${esc(u.id)}">${esc(u.nombre)} · ${esc(u.tiendaNombre)}</option>`).join("");
  }catch(e){$("uErr").textContent="No se pudo cargar la lista de usuarios. Revisa tu internet.";$("uErr").hidden=false;}
}
$("uEntrar").onclick=async()=>{
  $("uErr").hidden=true;const id=$("uSel").value,pin=$("uPin").value.trim();
  if(!id||!pin){$("uErr").textContent="Elige tu nombre y escribe tu clave.";$("uErr").hidden=false;return;}
  const b=$("uEntrar");b.disabled=true;
  try{const j=await apiPost({action:"usuario_login",usuario:id,upin:pin});
    if(!j.ok)throw new Error(j.error||"Error");
    sess={id:j.u.id,nombre:j.u.nombre,tienda:j.u.tienda,pin};store.set("od_user",JSON.stringify(sess));$("uPin").value="";pedidos=[];cargado=false;paintUser();
  }catch(e){$("uErr").textContent=(e&&e.message&&!/fetch/i.test(e.message))?e.message:"No se pudo conectar. Intenta de nuevo.";$("uErr").hidden=false;}
  finally{b.disabled=false;}
};
const salir=()=>{sess=null;store.del("od_user");cart=[];renderCart();pedidos=[];cargado=false;paintUser();cargarUsuarios();$("doneArea").hidden=true;$("formArea").hidden=false;showTab("nuevo");window.scrollTo({top:0});};
$("uSalir").onclick=salir;$("uSalir2").onclick=salir;
cargarUsuarios();

onCatalog=ok=>{
  $("catHint").textContent=ok?`${catalog.length.toLocaleString("es-PE")} productos. Escribe el nombre, la marca o el código para buscar.`:"No se pudo cargar el catálogo. Recarga la página.";
  if(ok){doSearch();}
};

let hl=-1,lastRes=[],brandF="__stock",shown=24;
const stkB=v=>v==null?`<span class="stkb zero">Almacén —</span>`:v<=0?`<span class="stkb zero">Sin stock</span>`:v<=3?`<span class="stkb low">Quedan ${v}</span>`:`<span class="stkb">Almacén ${v}</span>`;
const brandKey=p=>p.m&&p.m!=="OTRO"?p.m:"";
function fresh(){const b=$("results");b.classList.add("fresh");clearTimeout(fresh.t);fresh.t=setTimeout(()=>b.classList.remove("fresh"),1100);}
function buildBrands(){
  const cnt=new Map();catalog.forEach(p=>{const b=brandKey(p);if(!b)return;const o=cnt.get(b)||{n:0,s:0};o.n++;if((p.s||0)>0)o.s++;cnt.set(b,o);});
  const top=[...cnt.entries()].sort((a,b)=>b[1].s-a[1].s||b[1].n-a[1].n).slice(0,18);
  const stockN=catalog.filter(p=>(p.s||0)>0).length;
  $("brands").innerHTML=`<button type="button" class="chip all" data-b="__stock" aria-pressed="${brandF==="__stock"}">Con stock <span class="c">${stockN}</span></button><button type="button" class="chip all" data-b="__all" aria-pressed="${brandF==="__all"}">Todo <span class="c">${catalog.length.toLocaleString("es-PE")}</span></button>`+
    top.map(([b,o])=>`<button type="button" class="chip" data-b="${esc(b)}" aria-pressed="${brandF===b}">${avatar({m:b})}${esc(b)} <span class="c">${o.n}</span></button>`).join("");
  $("brands").querySelectorAll(".chip").forEach(c=>c.onclick=()=>{brandF=c.dataset.b;shown=24;$("q").value="";buildBrands();fresh();doSearch();});
}
function paintRes(list,total,toks,raw){
  const box=$("results");lastRes=list;hl=list.length&&raw?0:-1;
  const mark=s=>{for(const tk of toks){if(tk.length<2)continue;const i=norm(s).indexOf(tk);if(i<0)continue;
    return esc(s.slice(0,i))+"<mark>"+esc(s.slice(i,i+tk.length))+"</mark>"+esc(s.slice(i+tk.length));}return esc(s);};
  if(!list.length){box.innerHTML=`<div class="empty-res">${raw?`Sin resultados para “${esc(raw)}”. Prueba con otra palabra o la marca.`:"No hay productos en este filtro."}</div>`;return;}
  box.innerHTML=list.map((p,i)=>{const inl=cart.find(x=>x.c===p.c&&x.n===p.n);
    return `<button type="button" class="res${i===hl?" hl":""}${inl?" inlist":""}" data-i="${i}" style="--i:${Math.min(i,14)}">
      ${avatar(p)}<span class="body"><span class="n">${mark(p.n)}</span><span class="meta">${p.m?`<span>${esc(p.m)}</span>`:""}${stkB(p.s)}</span></span><span class="add">${inl?"✓ "+inl.q:"+"}</span>
    </button>`}).join("")+(total>list.length?(raw?`<div class="empty-res">${total} coincidencias — escribe más para afinar.</div>`:`<button type="button" class="btn ghost more" id="more">Ver más (${total-list.length} restantes)</button>`):"");
  box.querySelectorAll(".res").forEach(b=>b.onclick=()=>addToCart(lastRes[+b.dataset.i]));
  const m=$("more");if(m)m.onclick=()=>{shown+=24;doSearch();};
}
function doSearch(){
  const raw=$("q").value.trim(),q=norm(raw);
  if(!catalog.length)return;
  if(q.length<2){lastRes=[];$("results").innerHTML="";$("browseTitle").innerHTML="";return;}
  const toks=q.split(/\s+/).filter(Boolean),out=[];
  for(const it of idx){
    let score=0;
    if(it.c&&it.c===q)score=10000;
    else if(it.c&&q.length>=4&&/^\d+$/.test(q)&&it.c.startsWith(q))score=5000;
    else{let ok=true;for(const tk of toks){const i=it.t.indexOf(tk);if(i<0){ok=false;break;}score+=i===0?60:(it.t[i-1]===" "?30:5);}
      if(!ok)continue;score-=it.t.length*0.05;if((it.p.s||0)>0)score+=15;}
    out.push([score,it.p]);
  }
  out.sort((a,b)=>b[0]-a[0]);
  $("browseTitle").innerHTML=`<b>Resultados</b><span>${out.length} encontrados</span>`;
  paintRes(out.slice(0,24).map(x=>x[1]),out.length,toks,raw);
}
let st;$("q").addEventListener("input",()=>{clearTimeout(st);st=setTimeout(doSearch,90);});
$("q").addEventListener("keydown",e=>{
  if(!lastRes.length)return;
  if(e.key==="ArrowDown"){e.preventDefault();hl=Math.min(hl+1,lastRes.length-1);paintHl();}
  else if(e.key==="ArrowUp"){e.preventDefault();hl=Math.max(hl-1,0);paintHl();}
  else if(e.key==="Enter"&&hl>=0){e.preventDefault();addToCart(lastRes[hl]);}
  else if(e.key==="Escape"){$("q").value="";doSearch();}
});
function paintHl(){$("results").querySelectorAll(".res").forEach((b,i)=>{b.classList.toggle("hl",i===hl);if(i===hl)b.scrollIntoView({block:"nearest"});});}

function addToCart(p){
  const ex=cart.find(x=>x.c===p.c&&x.n===p.n);
  if(ex)ex.q+=1;else cart.push({c:p.c,n:p.n,m:p.m||"",q:1});
  const typed=!!$("q").value;$("q").value="";doSearch();if(typed&&matchMedia("(hover:hover)").matches)$("q").focus();renderCart();
}
function renderCart(){
  const el=$("cart"),units=cart.reduce((a,b)=>a+b.q,0);
  if(!cart.length){el.innerHTML=`<div class="cart-head"><strong>Productos del pedido</strong><span>vacío</span></div><div class="cart-empty"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h12l1 13H5L6 7Z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>Busca un producto arriba y tócalo para agregarlo.</div>`;validate();return;}
  el.innerHTML=`<div class="cart-head"><strong>Productos del pedido</strong><span>${cart.length} producto${cart.length>1?"s":""} · ${units} unid.</span></div>`+
    cart.map((it,i)=>{const s=stockOf(it);return `<div class="line">
      ${avatar(it)}<div><div class="n">${esc(it.n)}</div><div class="code">${esc(it.c)}${it.m?" · "+esc(it.m):""}</div><div class="stkl${s!=null&&s<it.q?" low":""}">Almacén: ${s==null?"—":s}</div></div>
      <div class="ctrl"><div class="qty"><button type="button" data-d="${i}" aria-label="Menos">−</button><input id="qty-${i}" inputmode="numeric" value="${it.q}" data-q="${i}" aria-label="Cantidad"><button type="button" data-u="${i}" aria-label="Más">+</button></div>
      <button type="button" class="rm" data-rm="${i}" aria-label="Quitar ${esc(it.n)}" title="Quitar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v5M14 11v5"/></svg><span>Quitar</span></button></div>
    </div>`}).join("");
  el.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{const it=cart[+b.dataset.d];if(it.q>1){it.q--;renderCart();}});
  el.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>{cart[+b.dataset.u].q++;renderCart();});
  el.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{cart.splice(+b.dataset.rm,1);renderCart();});
  el.querySelectorAll("[data-q]").forEach(inp=>inp.onchange=()=>{const v=parseInt(inp.value,10);cart[+inp.dataset.q].q=v>0?v:1;renderCart();});
  validate();
}
function refreshBar(){
  const units=cart.reduce((a,b)=>a+b.q,0),bar=$("bar");
  bar.hidden=!cart.length||$("formArea").hidden||$("viewNuevo").hidden;
  $("barN").textContent=units+" unid.";$("barS").textContent=cart.length+" producto"+(cart.length>1?"s":"");
}
$("barBtn").onclick=()=>$("cart").scrollIntoView({behavior:"smooth",block:"start"});
function validate(){
  const vOk=!!(sess&&sess.id);
  $("enviar").disabled=!(tienda&&vOk&&cart.length);
  const f=[];if(!vOk)f.push("entra con tu usuario");if(!cart.length)f.push("agrega al menos un producto");
  $("sendHint").textContent=f.length?"Falta: "+f.join(", ")+".":"Listo. Al enviar recibirás tu número de atención.";
  refreshBar();if(typeof lastRes!=="undefined"&&catalog.length&&$("results"))paintKeep();
}
function paintKeep(){$("results").querySelectorAll(".res").forEach(b=>{const p=lastRes[+b.dataset.i];if(!p)return;const inl=cart.find(x=>x.c===p.c&&x.n===p.n);b.classList.toggle("inlist",!!inl);b.querySelector(".add").textContent=inl?"✓ "+inl.q:"+";});}
renderCart();paintUser();

$("enviar").onclick=async()=>{
  $("sendErr").hidden=true;const btn=$("enviar");btn.disabled=true;btn.textContent="Enviando…";
  try{
    const j=await apiPost({action:"crear",usuario:sess.id,upin:sess.pin,items:cart});
    if(!j.ok)throw new Error(j.error);
    const t=TIENDAS.find(x=>x.id===tienda);
    $("doneNum").textContent=j.num;
    $("doneTxt").textContent=`${t.nombre} · ${sess.nombre} · ${cart.length} producto${cart.length>1?"s":""}. Con este número el almacén confirma cuando tu pedido sea atendido.`;
    cart=[];renderCart();cargado=false;
    $("formArea").hidden=true;$("doneArea").hidden=false;refreshBar();
  }catch(e){
    $("sendErr").textContent=(e&&e.message&&!/fetch/i.test(e.message))?e.message:"No se pudo enviar. Revisa tu internet e intenta de nuevo.";
    $("sendErr").hidden=false;
  }finally{btn.textContent="Enviar pedido";validate();}
};
$("copiar").onclick=()=>{const n=$("doneNum").textContent;try{navigator.clipboard.writeText(n);$("copiar").textContent="¡Copiado!";setTimeout(()=>$("copiar").textContent="Copiar número",1600);}catch(e){}};
$("otro").onclick=()=>{$("doneArea").hidden=true;$("formArea").hidden=false;refreshBar();window.scrollTo({top:0,behavior:"smooth"});};
$("verMis").onclick=()=>showTab("mis");

/* Mis pedidos (solo lectura) */
function renderChips(){
  const cnt=k=>pedidos.filter(p=>k==="todos"||(k==="activos"?p.estado!=="entregado":p.estado===k)).length;
  const opts=[["activos","Por atender"],["entregado","Entregados"],["todos","Todos"]];
  $("estadoChips").innerHTML=opts.map(([k,l])=>`<button type="button" class="chip" data-e="${k}" aria-pressed="${fEstado===k}">${l} <span class="c">${cnt(k)}</span></button>`).join("");
  $("estadoChips").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{fEstado=b.dataset.e;renderChips();renderList();});
}
function renderList(){
  const act=pedidos.filter(p=>p.estado!=="entregado").length;
  $("pendBadge").textContent=act;$("pendBadge").hidden=!act;
  const t=TIENDAS.find(x=>x.id===tienda);
  $("misTienda").textContent=sess?`Pedidos de ${sess.nombre}`:"";
  if(!sess){$("ticketList").innerHTML=`<div class="none">Entra con tu usuario en “Nuevo pedido” para ver tus pedidos.</div>`;return;}
  if(!cargado){$("ticketList").innerHTML=`<div class="none">Cargando…</div>`;return;}
  const list=pedidos.filter(p=>fEstado==="todos"||(fEstado==="activos"?p.estado!=="entregado":p.estado===fEstado));
  $("ticketList").innerHTML=list.length?list.map(p=>ticketHTML(p,null,false)).join(""):`<div class="none">No hay pedidos aquí.</div>`;
}
let cargando=false;
async function cargar(){
  renderChips();renderList();
  if(!sess||cargando)return;cargando=true;
  try{const j=await apiPost({action:"mis_pedidos",usuario:sess.id,upin:sess.pin});if(!j.ok)throw new Error(j.error);pedidos=j.pedidos;cargado=true;setConn("on","En línea");}
  catch(e){setConn("off","Sin conexión");if(!cargado)$("ticketList").innerHTML=`<div class="none">No se pudieron cargar los pedidos. Toca “Actualizar”.</div>`;}
  finally{cargando=false;}
  if(cargado){renderChips();renderList();}
}
$("refrescar").onclick=cargar;
setInterval(()=>{if(!$("viewMis").hidden&&!document.hidden)cargar();},30000);
</script>
